name: Sync Profile Masters UI v2

on:
  push:
    branches:
      - production-readiness-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip profile-masters-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0
      - name: Patch AdminControlPage
        run: |
          python - <<'PY'
          import base64, gzip, re
          def dec(path):
              return gzip.decompress(base64.b64decode(open(path, encoding='utf-8').read().strip())).decode('utf-8')
          path = 'src/features/admin/pages/AdminControlPage.tsx'
          s = open(path, encoding='utf-8').read()
          imports = dec('.github/profile-ui-sync/imports.gz.b64')
          types = dec('.github/profile-ui-sync/types.gz.b64')
          panel = dec('.github/profile-ui-sync/panel.gz.b64')
          req = 'import { RequisitionRecord, UserRole } from "@/types";\n'
          audit = 'import { recordSecurityAuditLog } from "@/services/auditLogger";\n'
          react = 'import React, { useEffect, useMemo, useState } from "react";\n'
          s = s.replace(req, '', 1).replace(audit, '', 1).replace(react, imports, 1)
          marker = '/* =========================================================\n   COMPONENT\n========================================================= */'
          if marker not in s: raise SystemExit('component marker not found')
          s = s.replace(marker, types + '\n' + panel + '\n' + marker, 1)
          pattern = re.compile(r'\n      /\{?\* =====================================================\n          PROFILE MASTERS\n      ===================================================== \*/.*?(?=\n      /\* =====================================================\n          SECURITY AUDIT)', re.S)
          replacement = '\n      {/* =====================================================\n          PROFILE MASTERS\n      ===================================================== */}\n\n      {activeSubTab === "profile_masters" && <ProfileMastersPanel />}\n'
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'profile section replacement count={n}')
          open(path, 'w', encoding='utf-8').write(s)
          print('patched', len(s))
          PY
      - name: Commit UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/admin/pages/AdminControlPage.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize profile masters admin UI [skip profile-masters-sync]'
          git push origin production-readiness-cleanup
