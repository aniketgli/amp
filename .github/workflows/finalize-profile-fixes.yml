name: Final Profile Fix Runner

on:
  push:
    branches: [production-readiness-cleanup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip profile-fixes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Apply profile integration patch and compile fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          workflow = Path('.github/workflows/finalize-profile-integration.yml')
          if workflow.exists():
              raw = workflow.read_text()
              marker = '          python - <<\'PY\'\n'
              if marker in raw:
                  script = raw.split(marker, 1)[1].split('\n          PY', 1)[0]
                  exec(compile(textwrap.dedent(script), 'embedded-profile-patch.py', 'exec'), {})

          admin = Path('src/features/admin/pages/AdminControlPage.tsx')
          s = admin.read_text()
          if 'function ManagementTable(' not in s:
              marker = 'function ProfileMastersPanel() {'
              helpers = '''function MasterStatusBadge({ status }: { status: string }) {\n  return <span className={`inline-flex px-2 py-1 rounded-full text-[10px] font-bold ${status === "active" ? "bg-emerald-50 text-emerald-700" : "bg-slate-100 text-slate-500"}`}>{status}</span>;\n}\n\nfunction ActionCell({ item, onEdit, onToggle }: { item: any; onEdit: () => void; onToggle: () => void }) {\n  return <td className="p-3 text-right"><div className="flex justify-end gap-1"><button type="button" onClick={onEdit} className="px-2 py-1 text-slate-700 hover:bg-slate-100 rounded-lg text-[10px] font-bold"><Edit3 className="w-3.5 h-3.5 inline mr-1" />Edit</button><button type="button" onClick={onToggle} className="px-2 py-1 text-slate-600 hover:bg-slate-100 rounded-lg text-[10px] font-bold">{item.status === "active" ? "Deactivate" : "Activate"}</button></div></td>;\n}\n\nfunction ManagementTable({ headers, rows, render }: { headers: string[]; rows: any[]; render: (item: any) => React.ReactNode }) {\n  return <div className="overflow-x-auto border border-slate-200 rounded-xl"><table className="w-full text-left text-xs"><thead className="bg-slate-50 border-b border-slate-200"><tr>{headers.map((header) => <th key={header} className="p-3 font-bold text-slate-600">{header}</th>)}</tr></thead><tbody className="divide-y divide-slate-100">{rows.length === 0 ? <tr><td colSpan={headers.length} className="p-8 text-center text-slate-400">No records found.</td></tr> : rows.map((item) => <tr key={item.id} className="hover:bg-slate-50/70">{render(item)}</tr>)}</tbody></table></div>;\n}\n\n'''
              if marker not in s: raise SystemExit('ProfileMastersPanel marker missing')
              s = s.replace(marker, helpers + marker, 1)
              admin.write_text(s)

          svc = Path('server/services/profile-master-admin.service.ts')
          p = svc.read_text()
          old1 = 'if((await db.query(`SELECT id FROM ${table} WHERE ${parentColumn}=? AND batch_number=? ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[parentId,batchNumber,excludeId]:[parentId,batchNumber]))[0]?.length)throw new Error("This batch number already exists for the selected parent.");'
          new1 = 'const [numberRows]: any = await db.query(`SELECT id FROM ${table} WHERE ${parentColumn}=? AND batch_number=? ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[parentId,batchNumber,excludeId]:[parentId,batchNumber]);if(numberRows?.length)throw new Error("This batch number already exists for the selected parent.");'
          p = p.replace(old1, new1, 1)
          old2 = 'if((await db.query(`SELECT id FROM ${table} WHERE LOWER(TRIM(batch_code))=LOWER(TRIM(?)) ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[batchCode,excludeId]:[batchCode]))[0]?.length)throw new Error("This batch code already exists.");'
          new2 = 'const [codeRows]: any = await db.query(`SELECT id FROM ${table} WHERE LOWER(TRIM(batch_code))=LOWER(TRIM(?)) ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[batchCode,excludeId]:[batchCode]);if(codeRows?.length)throw new Error("This batch code already exists.");'
          p = p.replace(old2, new2, 1)
          svc.write_text(p)
          print('final fixes applied')
          PY

      - name: Validate final tree
        run: |
          git diff --check
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit final tree and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/profile/pages/UserProfilePage.tsx server/services/profile.service.ts src/features/admin/pages/AdminControlPage.tsx server/services/profile-master-admin.service.ts
          git diff --cached --check
          git commit -m 'fix: finalize profile master integration and validation [skip profile-fixes]'
          git rm -f .github/workflows/finalize-profile-integration.yml .github/workflows/finalize-profile-fixes.yml
          git commit -m 'chore: remove temporary profile finalizer workflows [skip profile-fixes]'
          git push origin production-readiness-cleanup
