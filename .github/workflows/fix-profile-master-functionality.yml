name: Fix Profile Master Functionality

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply functionality patch
        run: python3 scripts/fix_profile_master_functionality.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/components/ProfileMastersSection.tsx server/repositories/profile-master.repository.ts src/features/profile/pages/UserProfilePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(profile): implement master CRUD and active dropdowns"
          git push
