name: Remove Admin Quick Statistics

on:
  push:
    branches:
      - production-readiness-cleanup
    paths-ignore:
      - .github/workflows/remove-admin-quick-statistics.yml

permissions:
  contents: write

jobs:
  remove-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Diagnose quick statistics panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/admin/pages/AdminControlPage.tsx")
          lines = path.read_text(encoding="utf-8").splitlines()
          label_index = next((i for i, line in enumerate(lines) if "Total System Users" in line), -1)
          comment_indices = [i for i, line in enumerate(lines) if "QUICK STATISTICS" in line]
          start = label_index - 3 if label_index >= 0 else -1
          closing = []
          if label_index >= 0:
              for i in range(label_index, min(label_index + 20, len(lines))):
                  if lines[i].strip() == "</div>":
                      closing.append((i, len(lines[i]) - len(lines[i].lstrip(" "))))

          out = [
              f"label_index={label_index}",
              f"comment_indices={comment_indices}",
              f"start={start}",
              f"closing={closing}",
              "context:",
          ]
          if label_index >= 0:
              lo = max(0, label_index - 6)
              hi = min(len(lines), label_index + 20)
              out.extend(f"{i}: {lines[i]!r}" for i in range(lo, hi))

          Path("scripts/.quickstats-diagnostic").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.quickstats-diagnostic
          git commit -m "chore: diagnostic quick statistics block"
          git push origin production-readiness-cleanup
