name: Remove Admin Quick Statistics

on:
  push:
    branches:
      - production-readiness-cleanup
    paths-ignore:
      - .github/workflows/remove-admin-quick-statistics.yml

permissions:
  contents: write

jobs:
  remove-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Remove quick statistics panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/admin/pages/AdminControlPage.tsx")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          label_index = next((i for i, line in enumerate(lines) if "Total System Users" in line), None)
          if label_index is None:
              raise SystemExit("Total System Users marker not found")

          start = label_index - 3
          if start < 0 or "QUICK STATISTICS" not in lines[start]:
              raise SystemExit("Quick statistics card start not found")

          end = next((i for i in range(label_index, len(lines)) if lines[i].strip() == "</div>" and lines[i].startswith("        ")), None)
          if end is None:
              raise SystemExit("Quick statistics card end not found")

          del lines[start:end + 1]
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Commit and push final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 26936caf89234b5f3d6de72959e30558c9ea7e4f -- .github/workflows/ci.yml
          git rm -f .github/workflows/remove-admin-quick-statistics.yml scripts/.remove-quick-statistics-trigger
          git add src/features/admin/pages/AdminControlPage.tsx .github/workflows/ci.yml
          git commit -m "chore: remove admin quick statistics panel"
          git push origin production-readiness-cleanup
