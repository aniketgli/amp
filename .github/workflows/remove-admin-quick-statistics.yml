name: Remove Admin Quick Statistics

on:
  push:
    branches:
      - production-readiness-cleanup
    paths-ignore:
      - .github/workflows/remove-admin-quick-statistics.yml

permissions:
  contents: write

jobs:
  remove-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Remove quick statistics panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/admin/pages/AdminControlPage.tsx")
          text = path.read_text(encoding="utf-8")

          start_marker = "        {/* QUICK STATISTICS */}"
          end_marker = "        </div>\n      </div>"

          start = text.find(start_marker)
          if start == -1:
              raise SystemExit("QUICK STATISTICS panel not found")

          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit("QUICK STATISTICS panel end not found")

          end += len("        </div>")
          updated = text[:start] + text[end:]
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/pages/AdminControlPage.tsx
          git commit -m "chore: remove admin quick statistics panel"
          git push origin production-readiness-cleanup
