name: Apply Profile Master Actions
on:
  push:
    branches: [production-readiness-cleanup]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch profile master actions
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('server/repositories/profile-master-admin.repository.ts')
          s=p.read_text()
          anchor='export async function setEmploymentTypeStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_employment_types SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}'
          if 'export async function deleteEmploymentType' not in s:
              s=s.replace(anchor, anchor+'\nexport async function deleteEmploymentType(id:number){await db.query(`DELETE FROM profile_employment_types WHERE id=?`,[id]);}',1)
          replacements=[
            ('export async function setOrgUnitStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_org_units SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}', 'export async function deleteOrgUnit(id:number){await db.query(`DELETE FROM profile_org_units WHERE id=?`,[id]);}'),
            ('export async function setBankStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_bank_masters SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}', 'export async function deleteBank(id:number){await db.query(`DELETE FROM profile_bank_masters WHERE id=?`,[id]);}'),
            ('export async function setDesignationStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_designation_masters SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}', 'export async function deleteDesignation(id:number){await db.query(`DELETE FROM profile_designation_masters WHERE id=?`,[id]);}'),
            ('export async function setStreamStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_stream_masters SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}', 'export async function deleteStream(id:number){await db.query(`DELETE FROM profile_stream_masters WHERE id=?`,[id]);}'),
            ('export async function setMscBatchStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_msc_batches SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}', 'export async function deleteMscBatch(id:number){await db.query(`DELETE FROM profile_msc_batches WHERE id=?`,[id]);}'),
            ('export async function setCourseStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_course_masters SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}', 'export async function deleteCourse(id:number){await db.query(`DELETE FROM profile_course_masters WHERE id=?`,[id]);}'),
            ('export async function setTraineeBatchStatus(id:number,status:MasterStatus){await db.query(`UPDATE profile_trainee_batches SET status=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,[status,id]);}', 'export async function deleteTraineeBatch(id:number){await db.query(`DELETE FROM profile_trainee_batches WHERE id=?`,[id]);}')
          ]
          for old,new in replacements:
              if new.split('(')[0].strip() not in s:
                  if old not in s: raise SystemExit('repository anchor not found: '+old[:60])
                  s=s.replace(old,old+'\n'+new,1)
          p.write_text(s)

          p=Path('server/services/profile-master-admin.service.ts')
          s=p.read_text()
          s=s.replace('setEmploymentTypeStatus, createOrgUnit', 'setEmploymentTypeStatus, deleteEmploymentType, createOrgUnit',1)
          s=s.replace('setOrgUnitStatus, createBank', 'setOrgUnitStatus, deleteOrgUnit, createBank',1)
          s=s.replace('setBankStatus, createDesignation', 'setBankStatus, deleteBank, createDesignation',1)
          s=s.replace('setDesignationStatus, createStream', 'setDesignationStatus, deleteDesignation, createStream',1)
          s=s.replace('setStreamStatus, createMscBatch', 'setStreamStatus, deleteStream, createMscBatch',1)
          s=s.replace('setMscBatchStatus, createCourse', 'setMscBatchStatus, deleteMscBatch, createCourse',1)
          s=s.replace('setCourseStatus, createTraineeBatch', 'setCourseStatus, deleteCourse, createTraineeBatch',1)
          s=s.replace('setTraineeBatchStatus }', 'setTraineeBatchStatus, deleteTraineeBatch }',1)
          if 'export async function removeEmploymentType' not in s:
              anchor='export async function addEmploymentType'
              funcs='''async function removeRecord(removeFn:any,value:unknown,label:string){const recordId=id(value,label);try{await removeFn(recordId);}catch(error){const e=error as any;if(e?.code==='ER_ROW_IS_REFERENCED_2'||e?.errno===1451)throw new Error(`Cannot delete this ${label.toLowerCase()} because it is already used by another record. Deactivate it instead.`);throw error;}return{ id:recordId };}\nexport const removeEmploymentType=(value:unknown)=>removeRecord(deleteEmploymentType,value,"Employment Type ID");\n'''
              s=s.replace(anchor,funcs+anchor,1)
          additions=[
            ('export async function addOrgUnit', 'export const removeOrgUnit=(value:unknown)=>removeRecord(deleteOrgUnit,value,"Organization ID");\n'),
            ('export async function addBank', 'export const removeBank=(value:unknown)=>removeRecord(deleteBank,value,"Bank ID");\n'),
            ('export async function addDesignation', 'export const removeDesignation=(value:unknown)=>removeRecord(deleteDesignation,value,"Designation ID");\n'),
            ('export async function addStream', 'export const removeStream=(value:unknown)=>removeRecord(deleteStream,value,"Stream ID");\n'),
            ('export async function addMscBatch', 'export const removeMscBatch=(value:unknown)=>removeRecord(deleteMscBatch,value,"MSc Batch ID");\n'),
            ('export async function addCourse', 'export const removeCourse=(value:unknown)=>removeRecord(deleteCourse,value,"Course ID");\n'),
            ('export async function addTraineeBatch', 'export const removeTraineeBatch=(value:unknown)=>removeRecord(deleteTraineeBatch,value,"Trainee Batch ID");\n')]
          for anchor,func in additions:
              if func.split('=')[0].strip() not in s:
                  if anchor not in s: raise SystemExit('service anchor not found: '+anchor)
                  s=s.replace(anchor,func+anchor,1)
          p.write_text(s)

          p=Path('server/controllers/profile-master-admin.controller.ts')
          s=p.read_text()
          if 'export async function deleteEmploymentType' not in s:
              anchor='export async function createEmploymentType'
              funcs='''export async function deleteEmploymentType(req:Request,res:Response){try{return ok(res,await service.removeEmploymentType(id(req)),"Employment type deleted successfully.");}catch(e){return fail(res,e,"Unable to delete employment type.");}}\n'''
              s=s.replace(anchor,funcs+anchor,1)
          additions=[
            ('export async function createOrgUnit','deleteOrgUnit','Organization'),('export async function createBank','deleteBank','Bank'),('export async function createDesignation','deleteDesignation','Designation'),('export async function createStream','deleteStream','Stream'),('export async function createMscBatch','deleteMscBatch','MSc batch'),('export async function createCourse','deleteCourse','Course'),('export async function createTraineeBatch','deleteTraineeBatch','Trainee batch')]
          for anchor,name,label in additions:
              marker=f'export async function {name}'
              if marker not in s:
                  funcs=f'export async function {name}(req:Request,res:Response){{try{{return ok(res,await service.remove{name[0].upper()+name[1:]}(id(req)),"{label} deleted successfully.");}}catch(e){{return fail(res,e,"Unable to delete {label.lower()}.");}}}}\n'
                  if anchor not in s: raise SystemExit('controller anchor not found: '+anchor)
                  s=s.replace(anchor,funcs+anchor,1)
          p.write_text(s)

          p=Path('server/routes/profile-master-admin.routes.ts')
          s=p.read_text()
          line='  app.get("/api/admin/profile-masters/employment-types", authenticateToken, administrator, controller.getAdminEmploymentTypes);'
          if 'controller.deleteEmploymentType' not in s: s=s.replace(line,line+'\n  app.delete("/api/admin/profile-masters/employment-types/:id", authenticateToken, administrator, controller.deleteEmploymentType);',1)
          pairs=[('org-units','deleteOrgUnit'),('banks','deleteBank'),('designations','deleteDesignation'),('streams','deleteStream'),('msc-batches','deleteMscBatch'),('courses','deleteCourse'),('trainee-batches','deleteTraineeBatch')]
          for path,name in pairs:
              marker=f'controller.{name}'
              if marker not in s:
                  # insert before first status route for this resource
                  resource=path
                  token=f'app.patch("/api/admin/profile-masters/{resource}/:id/status"'
                  pos=s.find(token)
                  if pos<0: raise SystemExit('route status anchor not found: '+resource)
                  insert=f'  app.delete("/api/admin/profile-masters/{resource}/:id", authenticateToken, administrator, controller.{name});\n'
                  s=s[:s.rfind('  ',0,pos)]+insert+s[s.rfind('  ',0,pos):]
          p.write_text(s)

          p=Path('src/api/profile.api.ts')
          s=p.read_text()
          if 'export const deleteProfileEmploymentType' not in s:
              anchor='export const getAdminProfileOrgUnits'
              funcs='''export const deleteProfileEmploymentType=(id:number)=>adminRequest<{id:number}>(`/api/admin/profile-masters/employment-types/${id}`,"DELETE");\n'''
              s=s.replace(anchor,funcs+anchor,1)
          pairs=[('OrgUnit','org-units'),('Bank','banks'),('Designation','designations'),('Stream','streams'),('MscBatch','msc-batches'),('Course','courses'),('TraineeBatch','trainee-batches')]
          for suffix,path in pairs:
              name=f'deleteProfile{suffix}'
              if name not in s:
                  anchor=f'export const createProfile{suffix}'
                  func=f'export const {name}=(id:number)=>adminRequest<{{id:number}}>(`/api/admin/profile-masters/{path}/${{id}}`,"DELETE");\n'
                  if anchor not in s: raise SystemExit('api anchor not found: '+suffix)
                  s=s.replace(anchor,func+anchor,1)
          p.write_text(s)

          p=Path('src/features/admin/pages/AdminControlPage.tsx')
          s=p.read_text()
          imports='''  deleteProfileEmploymentType,\n  deleteProfileOrgUnit,\n  deleteProfileBank,\n  deleteProfileDesignation,\n  deleteProfileStream,\n  deleteProfileMscBatch,\n  deleteProfileCourse,\n  deleteProfileTraineeBatch,\n'''
          if 'deleteProfileEmploymentType,' not in s:
              s=s.replace('  updateProfileEmploymentTypeStatus,\n', '  updateProfileEmploymentTypeStatus,\n'+imports,1)
          old='function MasterStatusBadge({status}:{status:string}){return <span className="px-2 py-1 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600">{status}</span>;}\nfunction ManagementTable({headers,rows,render}:{headers:string[];rows:any[];render:(item:any)=>React.ReactNode}){return <div className="overflow-x-auto border rounded-xl"><table className="w-full text-left text-xs"><thead><tr>{headers.map(h=><th key={h} className="p-3">{h}</th>)}</tr></thead><tbody>{rows.length===0?<tr><td colSpan={headers.length} className="p-8 text-center">No records found.</td></tr>:rows.map(item=><tr key={item.id}>{render(item)}</tr>)}</tbody></table></div>;}'
          new='''function MasterStatusBadge({status}:{status:string}){const active=String(status).toLowerCase()==="active";return <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold ${active?"bg-emerald-50 text-emerald-700":"bg-slate-100 text-slate-500"}`}><span className={`w-1.5 h-1.5 rounded-full ${active?"bg-emerald-500":"bg-slate-400"}`}/>{active?"Active":"Inactive"}</span>;}\nfunction ActionCell({item,onEdit,onToggle,onDelete}:{item:any;onEdit:()=>void;onToggle:()=>void;onDelete:()=>void}){const active=String(item.status).toLowerCase()==="active";return <td className="p-3"><div className="flex items-center justify-end gap-2"><button type="button" title={active?"Deactivate":"Activate"} aria-label={active?"Deactivate":"Activate"} onClick={onToggle} className={`relative inline-flex h-6 w-11 items-center rounded-full transition ${active?"bg-emerald-500":"bg-slate-300"}`}><span className={`inline-block h-4 w-4 rounded-full bg-white shadow transition-transform ${active?"translate-x-6":"translate-x-1"}`}/></button><button type="button" title="Edit" aria-label="Edit" onClick={onEdit} className="p-1.5 rounded-md text-purple-700 hover:bg-purple-50"><Edit3 className="w-4 h-4"/></button><button type="button" title="Delete" aria-label="Delete" onClick={onDelete} className="p-1.5 rounded-md text-red-600 hover:bg-red-50"><Trash2 className="w-4 h-4"/></button></div></td>;}\nfunction ManagementTable({headers,rows,render}:{headers:string[];rows:any[];render:(item:any)=>React.ReactNode}){return <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm bg-white"><table className="w-full text-left text-xs"><thead className="bg-slate-50 border-b border-slate-200"><tr>{headers.map((h,i)=><th key={h} className={`px-4 py-3 text-[10px] uppercase tracking-wider font-extrabold text-slate-500 ${i===headers.length-1?"text-right":""}`}>{h}</th>)}</tr></thead><tbody className="divide-y divide-slate-100">{rows.length===0?<tr><td colSpan={headers.length} className="px-4 py-12 text-center text-slate-400">No records found.</td></tr>:rows.map(item=><tr key={item.id} className="hover:bg-slate-50/70 transition-colors">{render(item)}</tr>)}</tbody></table></div>;}'''
          if old not in s: raise SystemExit('UI table anchor not found')
          s=s.replace(old,new,1)
          marker='  const toggle = async (target: ProfileMasterTab, item: any) => {'
          delete_block='''  const remove = async (target: ProfileMasterTab, item: any) => {\n    const labels: Record<ProfileMasterTab,string> = { employment:"employment type", banks:"bank", designations:"designation", organizations:"organization", streams:"stream", msc_batches:"MSc batch", courses:"course", trainee_batches:"trainee batch" };\n    const label=labels[target];\n    if (!window.confirm(`Delete this ${label}? This action cannot be undone.`)) return;\n    setError(null);\n    try {\n      if (target === "employment") await deleteProfileEmploymentType(item.id);\n      else if (target === "banks") await deleteProfileBank(item.id);\n      else if (target === "organizations") await deleteProfileOrgUnit(item.id);\n      else if (target === "designations") await deleteProfileDesignation(item.id);\n      else if (target === "streams") await deleteProfileStream(item.id);\n      else if (target === "msc_batches") await deleteProfileMscBatch(item.id);\n      else if (target === "courses") await deleteProfileCourse(item.id);\n      else if (target === "trainee_batches") await deleteProfileTraineeBatch(item.id);\n      await load();\n    } catch (e) { setError(e instanceof Error ? e.message : `Unable to delete ${label}.`); }\n  };\n\n'''
          if 'const remove = async (target: ProfileMasterTab' not in s:
              if marker not in s: raise SystemExit('UI toggle anchor not found')
              s=s.replace(marker,delete_block+marker,1)
          # Add delete handlers to every master table.
          for target in ['employment','banks','designations','organizations','streams','msc_batches','courses','trainee_batches']:
              needle=f'onToggle={{() => void toggle("{target}", item)}} />'
              repl=f'onToggle={{() => void toggle("{target}", item)}} onDelete={{() => void remove("{target}", item)}} />'
              if needle not in s: raise SystemExit('UI ActionCell target missing: '+target)
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src
          git diff --cached --quiet && exit 0
          git commit -m "feat: add master toggle edit delete controls"
          git push origin production-readiness-cleanup
