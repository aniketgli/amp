name: Apply personnel directory access rules

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply role-aware directory rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(p):
              return Path(p).read_text(encoding="utf-8")

          def write(p, s):
              Path(p).write_text(s, encoding="utf-8")

          # Backend: directory authorization + target-profile authorization.
          p = "server/services/profile.service.ts"
          s = read(p)
          if "export async function getProfileDirectoryForActor" not in s:
              s += '''

          /* ============================================================
             ROLE-AWARE PERSONNEL DIRECTORY
             ============================================================ */

          export interface ProfileDirectoryEntry {
            userId: number;
            applicantName: string;
            salutation: string | null;
            personalEmail: string | null;
            wiiOfficialEmail: string | null;
            designation: string | null;
            departmentCellProject: string | null;
            employmentType: string | null;
            biometricId: string | null;
          }

          const DIRECTORY_ADMIN_ROLES = new Set([
            "admin",
            "administrator",
            "super_admin",
            "system_administrator",
          ]);

          export async function getProfileDirectoryForActor(actorUserId: number, actorRole: string): Promise<ProfileDirectoryEntry[]> {
            const role = String(actorRole || "").trim().toLowerCase();
            const select = `
              SELECT ap.user_id, ap.salutation, ap.applicant_name, ap.personal_email,
                     ap.wii_official_email, ap.designation, ap.department_cell_project,
                     ap.employment_type, ap.biometric_id
              FROM applicant_profiles ap
              INNER JOIN users u ON u.id = ap.user_id
            `;
            const mapRows = (rows: any[]): ProfileDirectoryEntry[] => rows.map((row) => ({
              userId: Number(row.user_id),
              applicantName: String(row.applicant_name || ""),
              salutation: row.salutation == null ? null : String(row.salutation),
              personalEmail: row.personal_email == null ? null : String(row.personal_email),
              wiiOfficialEmail: row.wii_official_email == null ? null : String(row.wii_official_email),
              designation: row.designation == null ? null : String(row.designation),
              departmentCellProject: row.department_cell_project == null ? null : String(row.department_cell_project),
              employmentType: row.employment_type == null ? null : String(row.employment_type),
              biometricId: row.biometric_id == null ? null : String(row.biometric_id),
            }));

            if (DIRECTORY_ADMIN_ROLES.has(role)) {
              const [rows]: any = await db.query(`${select} WHERE u.status = 'active' AND ap.user_id <> ? ORDER BY ap.applicant_name ASC`, [actorUserId]);
              return mapRows(rows || []);
            }

            const [actorRows]: any = await db.query(
              `SELECT department_id, project_id, organization_id FROM applicant_profiles WHERE user_id = ? LIMIT 1`,
              [actorUserId],
            );
            const actor = actorRows?.[0] || {};
            const departmentId = actor.department_id == null ? null : Number(actor.department_id);
            const projectId = actor.project_id == null ? null : Number(actor.project_id);
            const organizationId = actor.organization_id == null ? null : Number(actor.organization_id);

            const [rows]: any = await db.query(
              `${select}
               WHERE u.status = 'active'
                 AND ap.user_id <> ?
                 AND (
                   ap.reporting_officer_id = ? OR
                   ap.reporting_manager_id = ? OR
                   ap.pi_user_id = ? OR
                   ap.supervising_officer_id = ? OR
                   (? IS NOT NULL AND ap.department_id = ?) OR
                   (? IS NOT NULL AND ap.project_id = ?) OR
                   (? IS NOT NULL AND ap.organization_id = ?)
                 )
               ORDER BY ap.applicant_name ASC`,
              [actorUserId, actorUserId, actorUserId, actorUserId, actorUserId, departmentId, departmentId, projectId, projectId, organizationId, organizationId],
            );
            return mapRows(rows || []);
          }

          export async function canActorViewProfile(actorUserId: number, actorRole: string, targetUserId: number): Promise<boolean> {
            const role = String(actorRole || "").trim().toLowerCase();
            if (actorUserId === targetUserId) return !DIRECTORY_ADMIN_ROLES.has(role);
            const allowed = await getProfileDirectoryForActor(actorUserId, role);
            return allowed.some((entry) => entry.userId === targetUserId);
          }
          '''
              write(p, s)

          # Controller: add directory endpoint and enforce target authorization.
          p = "server/controllers/profile.controller.ts"
          s = read(p)
          s = s.replace(
              "  getApplicantProfile,\n  saveApplicantProfile,",
              "  getApplicantProfile,\n  saveApplicantProfile,\n  getProfileDirectoryForActor,\n  canActorViewProfile,",
              1,
          )
          marker = "export async function getUserProfile(req: Request, res: Response) {"
          if "export async function getProfileDirectory(req: Request" not in s:
              s = s.replace(marker, '''export async function getProfileDirectory(req: Request, res: Response) {
            try {
              const actorUserId = getAuthenticatedUserId(req);
              const actorRole = String((req as any).user?.role || "").trim().toLowerCase();
              if (!actorUserId) return res.status(401).json({ success: false, message: "Authenticated user not found." });
              const data = await getProfileDirectoryForActor(actorUserId, actorRole);
              return res.json({ success: true, data });
            } catch (error) {
              console.error("GET /api/profile/directory ERROR:", error);
              return res.status(500).json({ success: false, message: "Unable to fetch personnel directory." });
            }
          }

          ''' + marker, 1)
          old = '''    if (!Number.isSafeInteger(numericUserId) || numericUserId <= 0) {
      return res.status(400).json({ success: false, message: "Invalid User ID." });
    }
    return res.json({ success: true, profile: await getApplicantProfile(numericUserId) });'''
          new = '''    if (!Number.isSafeInteger(numericUserId) || numericUserId <= 0) {
      return res.status(400).json({ success: false, message: "Invalid User ID." });
    }

    const actorUserId = getAuthenticatedUserId(req);
    const actorRole = String((req as any).user?.role || "").trim().toLowerCase();
    if (!actorUserId) return res.status(401).json({ success: false, message: "Authenticated user not found." });

    if (!(await canActorViewProfile(actorUserId, actorRole, numericUserId))) {
      return res.status(403).json({ success: false, message: "You are not authorized to view this employee profile." });
    }

    return res.json({ success: true, profile: await getApplicantProfile(numericUserId) });'''
          if old not in s:
              raise SystemExit("profile.controller authorization block not found")
          s = s.replace(old, new, 1)
          write(p, s)

          # Routes: include all directory-capable roles and the directory endpoint.
          p = "server/routes/profile.routes.ts"
          s = read(p)
          s = s.replace(
              "  getMyProfile,\n  getMyProfilePhoto,\n  getUserProfile,",
              "  getMyProfile,\n  getMyProfilePhoto,\n  getUserProfile,\n  getProfileDirectory,",
              1,
          )
          role_old = '''const PROFILE_DIRECTORY_ROLES = [
  "admin",
  "super_admin",
  "supervisor",
  "lab_nodal",
  "assoc_lab_nodal",
  "it_officer",
  "hrms_officer",
  "section_head",
] as const;'''
          role_new = '''const PROFILE_DIRECTORY_ROLES = [
  "admin",
  "administrator",
  "super_admin",
  "system_administrator",
  "supervisor",
  "reporting_manager",
  "manager",
  "nodal_officer",
  "associate_nodal_officer",
  "lab_nodal",
  "assoc_lab_nodal",
  "it_head",
  "it_officer",
  "hrms_officer",
  "section_head",
] as const;'''
          if role_old not in s:
              raise SystemExit("profile.routes role list not found")
          s = s.replace(role_old, role_new, 1)
          route_marker = '''  /* ==========================================================
     DIRECTORY PROFILE LOOKUP
     ========================================================== */

  app.get(
    "/api/profile/:userId",
    authenticateToken,
    requireRole(...PROFILE_DIRECTORY_ROLES),
    getUserProfile,
  );'''
          route_new = '''  /* ==========================================================
     PERSONNEL DIRECTORY
     ========================================================== */

  app.get(
    "/api/profile/directory",
    authenticateToken,
    requireRole(...PROFILE_DIRECTORY_ROLES),
    getProfileDirectory,
  );

  /* ==========================================================
     DIRECTORY PROFILE LOOKUP
     ========================================================== */

  app.get(
    "/api/profile/:userId",
    authenticateToken,
    requireRole(...PROFILE_DIRECTORY_ROLES),
    getUserProfile,
  );'''
          if route_marker not in s:
              raise SystemExit("profile.routes route marker not found")
          s = s.replace(route_marker, route_new, 1)
          write(p, s)

          # Admin profile update route: accept the canonical admin aliases.
          p = "server/routes/profile-admin.routes.ts"
          s = read(p)
          s = s.replace('    requireRole("administrator"),', '    requireRole("admin", "administrator", "super_admin", "system_administrator"),', 1)
          write(p, s)

          # Frontend API helpers.
          p = "src/api/profile.api.ts"
          s = read(p)
          s = s.replace(
              'interface PincodeResponse { success:boolean; message?:string; data?:{pincode:string;district:string;state:string}; }',
              'interface PincodeResponse { success:boolean; message?:string; data?:{pincode:string;district:string;state:string}; }\nexport interface ProfileDirectoryEntry { userId:number; applicantName:string; salutation:string|null; personalEmail:string|null; wiiOfficialEmail:string|null; designation:string|null; departmentCellProject:string|null; employmentType:string|null; biometricId:string|null; }\ninterface ProfileDirectoryResponse { success:boolean; message?:string; data?:ProfileDirectoryEntry[]; }',
              1,
          )
          marker = 'export async function getMyProfile(){'
          if 'export async function getProfileDirectory()' not in s:
              s = s.replace(marker, '''export async function getProfileDirectory(){const r=await apiRequest<ProfileDirectoryResponse>("/api/profile/directory",{method:"GET"});return r.data??[];}
export async function getUserProfile(userId:number|string){const r=await apiRequest<ProfileResponse>(`/api/profile/${encodeURIComponent(String(userId))}`,{method:"GET"});if(!r.profile)throw new Error(r.message||"Unable to load employee profile.");return r.profile;}
export async function updateProfileAsAdmin(userId:number|string,profile:Record<string,unknown>){const r=await apiRequest<ProfileResponse>(`/api/admin/profile/${encodeURIComponent(String(userId))}`,{method:"PUT",body:JSON.stringify(profile)});if(!r.profile)throw new Error(r.message||"Administrator profile update did not return the saved profile.");return r.profile;}
''' + marker, 1)
          write(p, s)

          # Frontend profile page.
          p = "src/features/profile/pages/UserProfilePage.tsx"
          s = read(p)
          s = s.replace('  MapPin,\n  Save,\n  User,', '  MapPin,\n  Save,\n  Search,\n  X,\n  User,', 1)
          s = s.replace('  getMyProfile,\n  getOrgUnits,', '  getMyProfile,\n  getProfileDirectory,\n  getUserProfile,\n  updateProfileAsAdmin,\n  getOrgUnits,', 1)
          s = s.replace('import type { ProfileDesignation, ProfileMscBatch, ProfileCourse, ProfileTraineeBatch, ProfileStream } from "@/types/profile";', 'import type { ProfileDesignation, ProfileMscBatch, ProfileCourse, ProfileTraineeBatch, ProfileStream } from "@/types/profile";\nimport type { ProfileDirectoryEntry } from "@/api/profile.api";', 1)

          state = '  const [validationAttempted, setValidationAttempted] = useState(false);'
          if 'const [directoryEntries, setDirectoryEntries]' not in s:
              s = s.replace(state, '''  const [validationAttempted, setValidationAttempted] = useState(false);
  const [currentUserId, setCurrentUserId] = useState<number | null>(null);
  const [directoryEntries, setDirectoryEntries] = useState<ProfileDirectoryEntry[]>([]);
  const [directorySearch, setDirectorySearch] = useState("");
  const [directoryOpen, setDirectoryOpen] = useState(false);
  const [selectedDirectoryUserId, setSelectedDirectoryUserId] = useState<number | null>(null);
  const [directoryLoading, setDirectoryLoading] = useState(false);
  const [directoryError, setDirectoryError] = useState("");''', 1)

          role = '  const adminCanEditOfficialFields = isAdminRole(currentRole);'
          s = s.replace(role, '''  const adminCanEditOfficialFields = isAdminRole(currentRole);
  const directoryAdminRole = isAdminRole(currentRole);
  const selfOnlyRole = ["applicant", "user"].includes(String(currentRole).toLowerCase());
  const directoryCanBrowse = !selfOnlyRole;
  const profileEditable = selfOnlyRole || (directoryAdminRole && selectedDirectoryUserId !== null && selectedDirectoryUserId !== currentUserId);
  const visibleDirectoryEntries = useMemo(() => directoryEntries.filter((entry) => !directoryAdminRole || entry.userId !== currentUserId), [directoryEntries, directoryAdminRole, currentUserId]);
  const filteredDirectoryEntries = useMemo(() => {
    const q = directorySearch.trim().toLowerCase();
    if (!q) return visibleDirectoryEntries;
    return visibleDirectoryEntries.filter((entry) => [entry.applicantName, entry.personalEmail, entry.wiiOfficialEmail, entry.designation, entry.departmentCellProject, entry.employmentType, entry.biometricId].some((value) => String(value || "").toLowerCase().includes(q)));
  }, [directorySearch, visibleDirectoryEntries]);''', 1)

          promise_old = '''        const [savedProfile, employment, units, bankList, designationList, streamList, mscBatchList, courseList, traineeBatchList, officerList] = await Promise.all([
          getMyProfile(), getEmploymentTypes(), getOrgUnits(["department", "cell", "project"]), getBanks(), getDesignations(), getStreams(), getMscBatches(), getCourses(), getTraineeBatches(), getProfileOfficers(),
        ]);'''
          promise_new = '''        const directoryPromise = directoryCanBrowse ? getProfileDirectory().catch(() => []) : Promise.resolve([] as ProfileDirectoryEntry[]);
        const [savedProfile, employment, units, bankList, designationList, streamList, mscBatchList, courseList, traineeBatchList, officerList, directoryList] = await Promise.all([
          getMyProfile(), getEmploymentTypes(), getOrgUnits(["department", "cell", "project"]), getBanks(), getDesignations(), getStreams(), getMscBatches(), getCourses(), getTraineeBatches(), getProfileOfficers(), directoryPromise,
        ]);'''
          if promise_old not in s:
              raise SystemExit("UserProfilePage Promise.all marker not found")
          s = s.replace(promise_old, promise_new, 1)

          profile_old = '''        setEmploymentTypes(employment); setOrgUnits(units); setBanks(bankList); setDesignations(designationList); setStreams(streamList); setMscBatches(mscBatchList); setCourses(courseList); setTraineeBatches(traineeBatchList); setOfficers(officerList);
        if (savedProfile) { const master=employment.find((x)=>x.displayName===savedProfile.employmentType||x.code===savedProfile.employmentType); setProfile({ ...toFormState(savedProfile), employmentTypeId: savedProfile.employmentTypeId ?? master?.id ?? null }); }'''
          profile_new = '''        setEmploymentTypes(employment); setOrgUnits(units); setBanks(bankList); setDesignations(designationList); setStreams(streamList); setMscBatches(mscBatchList); setCourses(courseList); setTraineeBatches(traineeBatchList); setOfficers(officerList);
        if (savedProfile) setCurrentUserId(Number(savedProfile.userId));
        setDirectoryEntries(directoryList);
        if (directoryCanBrowse && directoryList.length > 0) {
          const firstEntry = directoryList[0];
          setSelectedDirectoryUserId(firstEntry.userId);
          setDirectorySearch(firstEntry.applicantName);
          try {
            const targetProfile = await getUserProfile(firstEntry.userId);
            const master=employment.find((x)=>x.displayName===targetProfile.employmentType||x.code===targetProfile.employmentType);
            setProfile({ ...toFormState(targetProfile), employmentTypeId: targetProfile.employmentTypeId ?? master?.id ?? null });
          } catch (error) {
            setDirectoryError(error instanceof Error ? error.message : "Unable to load authorized employee profile.");
            if (savedProfile) { const master=employment.find((x)=>x.displayName===savedProfile.employmentType||x.code===savedProfile.employmentType); setSelectedDirectoryUserId(null); setProfile({ ...toFormState(savedProfile), employmentTypeId: savedProfile.employmentTypeId ?? master?.id ?? null }); }
          }
        } else if (savedProfile) {
          const master=employment.find((x)=>x.displayName===savedProfile.employmentType||x.code===savedProfile.employmentType);
          setSelectedDirectoryUserId(selfOnlyRole ? Number(savedProfile.userId) : null);
          setProfile({ ...toFormState(savedProfile), employmentTypeId: savedProfile.employmentTypeId ?? master?.id ?? null });
        }'''
          if profile_old not in s:
              raise SystemExit("UserProfilePage profile load marker not found")
          s = s.replace(profile_old, profile_new, 1)
          s = s.replace('  }, []);\n\n  useEffect(() => () => {', '  }, [currentRole]);\n\n  useEffect(() => () => {', 1)

          # Directory selection helper.
          helper_marker = '  const handleChange = (field: keyof FormState, value: string | number | null) => {'
          helper = '''  const handleDirectorySelect = async (entry: ProfileDirectoryEntry) => {
    setDirectoryOpen(false);
    setDirectorySearch(entry.applicantName);
    setSelectedDirectoryUserId(entry.userId);
    setDirectoryError("");
    setDirectoryLoading(true);
    try {
      const targetProfile = await getUserProfile(entry.userId);
      const master = employmentTypes.find((x) => x.displayName === targetProfile.employmentType || x.code === targetProfile.employmentType);
      setProfile({ ...toFormState(targetProfile), employmentTypeId: targetProfile.employmentTypeId ?? master?.id ?? null });
      setSaveError("");
      setValidationAttempted(false);
    } catch (error) {
      setDirectoryError(error instanceof Error ? error.message : "Unable to load employee profile.");
    } finally {
      setDirectoryLoading(false);
    }
  };

'''
          if 'const handleDirectorySelect = async' not in s:
              if helper_marker not in s: raise SystemExit("UserProfilePage handleChange marker not found")
              s = s.replace(helper_marker, helper + helper_marker, 1)

          # Submit: normal users update themselves; admins update only a selected other employee; other roles cannot submit.
          s = s.replace('    if (saving || loading) return;\n    setValidationAttempted(true);', '    if (saving || loading) return;\n    if (!profileEditable) { setSaveError("This employee profile is read-only for your role."); return; }\n    setValidationAttempted(true);', 1)
          s = s.replace('      let savedProfile = await updateMyProfile(payload);', '      const editingOtherProfile = directoryAdminRole && selectedDirectoryUserId !== null && selectedDirectoryUserId !== currentUserId;\n      let savedProfile = editingOtherProfile ? await updateProfileAsAdmin(selectedDirectoryUserId, payload) : await updateMyProfile(payload);', 1)
          s = s.replace('(currentRole === "applicant" || currentRole === "user" || adminCanEditOfficialFields)', 'selfOnlyRole', 1)

          # Header: place the directory search at the top-right, matching the supplied layout.
          pattern = re.compile(r'      <div className="bg-slate-900 text-white rounded-2xl p-4 sm:p-6 border border-slate-800 shadow-md relative overflow-hidden min-h-\[140px\]">.*?\n      </div>\n\n      <form onSubmit', re.S)
          replacement = '''      <div className="bg-slate-900 text-white rounded-2xl p-4 sm:p-6 border border-slate-800 shadow-md relative overflow-visible min-h-[140px]">
        <div className="absolute top-0 right-0 w-80 h-full bg-emerald-500/5 pointer-events-none blur-2xl" />
        <div className="relative z-10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
          <div className="space-y-2 min-w-0">
            <div className="flex flex-wrap items-center gap-2"><span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 tracking-wider flex items-center gap-1"><BadgeCheck className="w-3.5 h-3.5" />Access Management Portal</span><span className="text-xs text-slate-400">• Wildlife Institute of India</span></div>
            <h1 className="text-lg sm:text-2xl font-extrabold tracking-tight">{selfOnlyRole ? "User Profile & Service Records" : "Admin Personnel Records & Directory"}</h1>
            <p className="text-xs text-slate-300 leading-relaxed max-w-xl">{selfOnlyRole ? "Maintain your official personal, employment, academic, project and bank records." : "Search and inspect official service records, designations, and bank details for authorized personnel."}</p>
          </div>
          {directoryCanBrowse && <div className="relative z-30 w-full lg:w-[390px] shrink-0">
            <div className="flex items-center justify-between gap-2 mb-1.5"><span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-300">Personnel Directory</span><span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${directoryAdminRole ? "text-amber-300 bg-amber-950/60 border-amber-800" : "text-emerald-300 bg-emerald-950/60 border-emerald-800"}`}>{directoryAdminRole ? "ADMIN • EDIT" : "RELATED • VIEW"}</span></div>
            <div className="relative"><div className="flex items-center gap-2 bg-slate-800/95 border border-slate-700 rounded-xl px-3 py-2 shadow-inner"><Search className="w-4 h-4 text-emerald-400 shrink-0" /><input type="text" value={directorySearch} onChange={(e) => { setDirectorySearch(e.target.value); setDirectoryOpen(true); }} onFocus={() => setDirectoryOpen(true)} placeholder="Search staff by name or email..." className="bg-transparent text-white placeholder-slate-400 focus:outline-none w-full text-xs min-w-0" />{directorySearch && <button type="button" onClick={() => { setDirectorySearch(""); setDirectoryOpen(true); }} className="p-0.5 text-slate-400 hover:text-white cursor-pointer"><X className="w-3.5 h-3.5" /></button>}</div>
              {directoryOpen && <div className="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden max-h-72 overflow-y-auto"><div className="p-2 border-b border-slate-800 bg-slate-950 flex items-center justify-between"><span className="text-[10px] font-bold text-slate-400">{directorySearch.trim() ? `MATCHING PERSONNEL (${filteredDirectoryEntries.length})` : `AUTHORIZED PERSONNEL (${visibleDirectoryEntries.length})`}</span><button type="button" onClick={() => setDirectoryOpen(false)} className="text-[10px] text-slate-400 hover:text-white cursor-pointer">Close</button></div>{directoryLoading && <div className="p-3 text-xs text-slate-400 text-center">Loading profile...</div>}{!directoryLoading && filteredDirectoryEntries.length === 0 && <div className="p-3 text-xs text-slate-400 text-center">No matching personnel profile found.</div>}{!directoryLoading && filteredDirectoryEntries.map((entry) => <button key={entry.userId} type="button" onClick={() => void handleDirectorySelect(entry)} className={`w-full text-left p-2.5 hover:bg-slate-800 flex items-center gap-2.5 border-b border-slate-800/60 transition-colors cursor-pointer ${selectedDirectoryUserId === entry.userId ? "bg-slate-800/90 border-l-4 border-l-emerald-400" : ""}`}><div className="w-8 h-8 rounded-full bg-emerald-950 border border-emerald-800 flex items-center justify-center shrink-0"><User className="w-4 h-4 text-emerald-400" /></div><div className="flex-1 min-w-0"><div className="flex items-center justify-between gap-2"><span className="text-xs font-extrabold text-white truncate">{entry.salutation ? `${entry.salutation} ` : ""}{entry.applicantName}</span><span className="text-[10px] font-mono text-emerald-400">#{entry.userId}</span></div><p className="text-[11px] text-slate-400 truncate">{entry.designation || "—"} • {entry.departmentCellProject || entry.employmentType || "—"}</p></div></button>)}</div>}
            </div>
            {directoryError && <p className="mt-1.5 text-[10px] text-rose-300">{directoryError}</p>}
          </div>}
        </div>
      </div>

      <form onSubmit'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1: raise SystemExit("UserProfilePage header marker not found")

          # Read-only roles cannot interact with form controls or submit.
          s = s.replace('.profile-required-star { color:#dc2626; font-weight:800; margin-left:2px; }', '.profile-required-star { color:#dc2626; font-weight:800; margin-left:2px; }\n        .profile-form.directory-readonly input, .profile-form.directory-readonly select, .profile-form.directory-readonly textarea { pointer-events:none; background-color:#f1f5f9 !important; color:#64748b !important; }\n        .profile-form.directory-readonly button[type="submit"] { display:none; }', 1)
          s = s.replace('className={`profile-form space-y-5 ${validationAttempted ? "validation-attempted" : ""}`}', 'className={`profile-form space-y-5 ${validationAttempted ? "validation-attempted" : ""} ${!profileEditable ? "directory-readonly" : ""}`}', 1)
          write(p, s)

          print("Role-aware personnel directory patch completed")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/profile.service.ts server/controllers/profile.controller.ts server/routes/profile.routes.ts server/routes/profile-admin.routes.ts src/api/profile.api.ts src/features/profile/pages/UserProfilePage.tsx
          git rm -f .github/workflows/apply-personnel-directory-rules.yml
          git commit -m "feat: enforce role-aware personnel profile directory"
          git push origin HEAD:${GITHUB_REF_NAME}
