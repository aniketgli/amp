name: Apply personnel directory access rules

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run patch script
        run: python scripts/apply_personnel_directory_rules.py
      - name: Commit patched application code and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/profile.service.ts server/controllers/profile.controller.ts server/routes/profile.routes.ts server/routes/profile-admin.routes.ts src/api/profile.api.ts src/features/profile/pages/UserProfilePage.tsx
          git rm -f scripts/apply_personnel_directory_rules.py .github/workflows/apply-personnel-directory-rules.yml
          git commit -m "feat: enforce role-aware personnel profile directory"
          git push origin HEAD:${GITHUB_REF_NAME}
