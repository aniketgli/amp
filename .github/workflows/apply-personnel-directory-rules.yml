name: Apply personnel directory access rules

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply role-aware personnel directory changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # ------------------------------------------------------------
          # Backend profile service: directory + target authorization.
          # ------------------------------------------------------------
          path = "server/services/profile.service.ts"
          text = read(path)
          if "getProfileDirectoryForActor" not in text:
              text += r'''

          /* ============================================================
             PERSONNEL DIRECTORY AUTHORIZATION
             ============================================================ */

          export interface ProfileDirectoryEntry {
            userId: number;
            applicantName: string;
            salutation: string | null;
            personalEmail: string | null;
            wiiOfficialEmail: string | null;
            designation: string | null;
            departmentCellProject: string | null;
            employmentType: string | null;
            biometricId: string | null;
          }

          const DIRECTORY_ADMIN_ROLES = new Set([
            "admin",
            "administrator",
            "super_admin",
            "system_administrator",
          ]);

          export async function getProfileDirectoryForActor(
            actorUserId: number,
            actorRole: string,
          ): Promise<ProfileDirectoryEntry[]> {
            const normalizedRole = String(actorRole || "").trim().toLowerCase();

            const baseSelect = `
              SELECT
                ap.user_id,
                ap.salutation,
                ap.applicant_name,
                ap.personal_email,
                ap.wii_official_email,
                ap.designation,
                ap.department_cell_project,
                ap.employment_type,
                ap.biometric_id
              FROM applicant_profiles ap
              INNER JOIN users u ON u.id = ap.user_id
            `;

            const mapRows = (rows: any[]): ProfileDirectoryEntry[] =>
              rows.map((row) => ({
                userId: Number(row.user_id),
                applicantName: String(row.applicant_name || ""),
                salutation: row.salutation == null ? null : String(row.salutation),
                personalEmail: row.personal_email == null ? null : String(row.personal_email),
                wiiOfficialEmail: row.wii_official_email == null ? null : String(row.wii_official_email),
                designation: row.designation == null ? null : String(row.designation),
                departmentCellProject: row.department_cell_project == null ? null : String(row.department_cell_project),
                employmentType: row.employment_type == null ? null : String(row.employment_type),
                biometricId: row.biometric_id == null ? null : String(row.biometric_id),
              }));

            if (DIRECTORY_ADMIN_ROLES.has(normalizedRole)) {
              const [rows]: any = await db.query(
                `${baseSelect}
                 WHERE u.status = 'active'
                   AND ap.user_id <> ?
                 ORDER BY ap.applicant_name ASC`,
                [actorUserId],
              );
              return mapRows(rows || []);
            }

            const [actorRows]: any = await db.query(
              `
                SELECT department_id, project_id, organization_id
                FROM applicant_profiles
                WHERE user_id = ?
                LIMIT 1
              `,
              [actorUserId],
            );

            const actor = actorRows?.[0] || {};
            const departmentId = actor.department_id == null ? null : Number(actor.department_id);
            const projectId = actor.project_id == null ? null : Number(actor.project_id);
            const organizationId = actor.organization_id == null ? null : Number(actor.organization_id);

            const [rows]: any = await db.query(
              `${baseSelect}
               WHERE u.status = 'active'
                 AND ap.user_id <> ?
                 AND (
                   ap.reporting_officer_id = ?
                   OR ap.reporting_manager_id = ?
                   OR ap.pi_user_id = ?
                   OR ap.supervising_officer_id = ?
                   OR (? IS NOT NULL AND ap.department_id = ?)
                   OR (? IS NOT NULL AND ap.project_id = ?)
                   OR (? IS NOT NULL AND ap.organization_id = ?)
                 )
               ORDER BY ap.applicant_name ASC`,
              [
                actorUserId,
                actorUserId,
                actorUserId,
                actorUserId,
                actorUserId,
                departmentId,
                departmentId,
                projectId,
                projectId,
                organizationId,
                organizationId,
              ],
            );

            return mapRows(rows || []);
          }

          export async function canActorViewProfile(
            actorUserId: number,
            actorRole: string,
            targetUserId: number,
          ): Promise<boolean> {
            if (actorUserId === targetUserId) {
              return !DIRECTORY_ADMIN_ROLES.has(String(actorRole || "").trim().toLowerCase());
            }

            const allowed = await getProfileDirectoryForActor(actorUserId, actorRole);
            return allowed.some((entry) => entry.userId === targetUserId);
          }
          '''
              write(path, text)

          # ------------------------------------------------------------
          # Profile controller: enforce target authorization and directory.
          # ------------------------------------------------------------
          path = "server/controllers/profile.controller.ts"
          text = read(path)
          text = text.replace(
              "  getApplicantProfile,\n  saveApplicantProfile,",
              "  getApplicantProfile,\n  saveApplicantProfile,\n  getProfileDirectoryForActor,\n  canActorViewProfile,",
          )
          marker = 'export async function getUserProfile(req: Request, res: Response) {'
          if marker in text and "getProfileDirectory(req: Request" not in text:
              replacement = '''export async function getProfileDirectory(req: Request, res: Response) {
            try {
              const actorUserId = getAuthenticatedUserId(req);
              const actorRole = String((req as any).user?.role || "").trim().toLowerCase();
              if (!actorUserId) return res.status(401).json({ success: false, message: "Authenticated user not found." });

              const data = await getProfileDirectoryForActor(actorUserId, actorRole);
              return res.json({ success: true, data });
            } catch (error) {
              console.error("GET /api/profile/directory ERROR:", error);
              return res.status(500).json({ success: false, message: "Unable to fetch personnel directory." });
            }
          }

          ''' + marker
              text = text.replace(marker, replacement)

          old = '''    if (!Number.isSafeInteger(numericUserId) || numericUserId <= 0) {
      return res.status(400).json({ success: false, message: "Invalid User ID." });
    }
    return res.json({ success: true, profile: await getApplicantProfile(numericUserId) });'''
          new = '''    if (!Number.isSafeInteger(numericUserId) || numericUserId <= 0) {
      return res.status(400).json({ success: false, message: "Invalid User ID." });
    }

    const actorUserId = getAuthenticatedUserId(req);
    const actorRole = String((req as any).user?.role || "").trim().toLowerCase();
    if (!actorUserId) return res.status(401).json({ success: false, message: "Authenticated user not found." });

    const allowed = await canActorViewProfile(actorUserId, actorRole, numericUserId);
    if (!allowed) {
      return res.status(403).json({ success: false, message: "You are not authorized to view this employee profile." });
    }

    return res.json({ success: true, profile: await getApplicantProfile(numericUserId) });'''
          if old not in text:
              raise SystemExit("profile.controller target authorization marker not found")
          text = text.replace(old, new, 1)
          write(path, text)

          # ------------------------------------------------------------
          # Profile routes: directory + authorized target photo.
          # ------------------------------------------------------------
          path = "server/routes/profile.routes.ts"
          text = read(path)
          text = text.replace(
              '  getMyProfile,\n  getMyProfilePhoto,\n  getUserProfile,',
              '  getMyProfile,\n  getMyProfilePhoto,\n  getUserProfile,\n  getProfileDirectory,',
          )
          text = text.replace(
              'const PROFILE_DIRECTORY_ROLES = [\n  "admin",\n  "super_admin",\n  "supervisor",\n  "lab_nodal",\n  "assoc_lab_nodal",\n  "it_officer",\n  "hrms_officer",\n  "section_head",\n] as const;',
              '''const PROFILE_DIRECTORY_ROLES = [
            "admin",
            "administrator",
            "super_admin",
            "system_administrator",
            "supervisor",
            "reporting_manager",
            "manager",
            "nodal_officer",
            "associate_nodal_officer",
            "lab_nodal",
            "assoc_lab_nodal",
            "it_head",
            "it_officer",
            "hrms_officer",
            "section_head",
          ] as const;''',
          )
          route_marker = '''  /* ==========================================================
     DIRECTORY PROFILE LOOKUP
     ========================================================== */

  app.get(
    "/api/profile/:userId",
    authenticateToken,
    requireRole(...PROFILE_DIRECTORY_ROLES),
    getUserProfile,
  );'''
          route_replacement = '''  /* ==========================================================
     PERSONNEL DIRECTORY
     ========================================================== */

  app.get(
    "/api/profile/directory",
    authenticateToken,
    requireRole(...PROFILE_DIRECTORY_ROLES),
    getProfileDirectory,
  );

  /* ==========================================================
     DIRECTORY PROFILE LOOKUP
     ========================================================== */

  app.get(
    "/api/profile/:userId",
    authenticateToken,
    requireRole(...PROFILE_DIRECTORY_ROLES),
    getUserProfile,
  );'''
          if route_marker not in text:
              raise SystemExit("profile.routes directory marker not found")
          text = text.replace(route_marker, route_replacement, 1)
          write(path, text)

          # ------------------------------------------------------------
          # Frontend profile API.
          # ------------------------------------------------------------
          path = "src/api/profile.api.ts"
          text = read(path)
          text = text.replace(
              'interface PincodeResponse { success:boolean; message?:string; data?:{pincode:string;district:string;state:string}; }',
              'interface PincodeResponse { success:boolean; message?:string; data?:{pincode:string;district:string;state:string}; }\nexport interface ProfileDirectoryEntry { userId:number; applicantName:string; salutation:string|null; personalEmail:string|null; wiiOfficialEmail:string|null; designation:string|null; departmentCellProject:string|null; employmentType:string|null; biometricId:string|null; }\ninterface ProfileDirectoryResponse { success:boolean; message?:string; data?:ProfileDirectoryEntry[]; }',
          )
          api_marker = 'export async function getMyProfile(){'
          api_add = '''export async function getProfileDirectory(){const r=await apiRequest<ProfileDirectoryResponse>("/api/profile/directory",{method:"GET"});return r.data??[];}
export async function getUserProfile(userId:number|string){const r=await apiRequest<ProfileResponse>(`/api/profile/${encodeURIComponent(String(userId))}`,{method:"GET"});if(!r.profile)throw new Error(r.message||"Unable to load employee profile.");return r.profile;}
export async function updateProfileAsAdmin(userId:number|string,profile:Record<string,unknown>){const r=await apiRequest<ProfileResponse>(`/api/admin/profile/${encodeURIComponent(String(userId))}`,{method:"PUT",body:JSON.stringify(profile)});if(!r.profile)throw new Error(r.message||"Administrator profile update did not return the saved profile.");return r.profile;}
'''
          if api_marker not in text:
              raise SystemExit("profile.api insertion marker not found")
          text = text.replace(api_marker, api_add + api_marker, 1)
          write(path, text)

          # ------------------------------------------------------------
          # Current profile page: role-aware directory/search UX.
          # ------------------------------------------------------------
          path = "src/features/profile/pages/UserProfilePage.tsx"
          text = read(path)
          text = text.replace(
              '  MapPin,\n  Save,\n  User,',
              '  MapPin,\n  Save,\n  Search,\n  X,\n  User,',
          )
          text = text.replace(
              '  getMyProfile,\n  getOrgUnits,',
              '  getMyProfile,\n  getProfileDirectory,\n  getUserProfile,\n  updateProfileAsAdmin,\n  getOrgUnits,',
          )
          text = text.replace(
              'import type { ProfileDesignation, ProfileMscBatch, ProfileCourse, ProfileTraineeBatch, ProfileStream } from "@/types/profile";',
              'import type { ProfileDesignation, ProfileMscBatch, ProfileCourse, ProfileTraineeBatch, ProfileStream, ProfileDirectoryEntry } from "@/types/profile";',
          )
          # If ProfileDirectoryEntry is not exported from profile types, import it from API instead.
          if 'ProfileDirectoryEntry } from "@/types/profile"' in text:
              text = text.replace(
                  'import type { ProfileDesignation, ProfileMscBatch, ProfileCourse, ProfileTraineeBatch, ProfileStream, ProfileDirectoryEntry } from "@/types/profile";',
                  'import type { ProfileDesignation, ProfileMscBatch, ProfileCourse, ProfileTraineeBatch, ProfileStream } from "@/types/profile";\nimport type { ProfileDirectoryEntry } from "@/api/profile.api";',
              )

          state_marker = '  const [validationAttempted, setValidationAttempted] = useState(false);'
          state_add = '''  const [validationAttempted, setValidationAttempted] = useState(false);
  const [currentUserId, setCurrentUserId] = useState<number | null>(null);
  const [directoryEntries, setDirectoryEntries] = useState<ProfileDirectoryEntry[]>([]);
  const [directorySearch, setDirectorySearch] = useState("");
  const [directoryOpen, setDirectoryOpen] = useState(false);
  const [selectedDirectoryUserId, setSelectedDirectoryUserId] = useState<number | null>(null);
  const [directoryLoading, setDirectoryLoading] = useState(false);
  const [directoryError, setDirectoryError] = useState("");'''
          if state_marker not in text:
              raise SystemExit("UserProfilePage state marker not found")
          text = text.replace(state_marker, state_add, 1)

          role_marker = '  const adminCanEditOfficialFields = isAdminRole(currentRole);'
          role_add = '''  const adminCanEditOfficialFields = isAdminRole(currentRole);
  const directoryAdminRole = isAdminRole(currentRole);
  const selfOnlyRole = ["applicant", "user"].includes(String(currentRole).toLowerCase());
  const directoryCanBrowse = !selfOnlyRole;
  const profileEditable = selfOnlyRole || (directoryAdminRole && selectedDirectoryUserId !== null && selectedDirectoryUserId !== currentUserId);
  const visibleDirectoryEntries = useMemo(() => directoryEntries.filter((entry) => !directoryAdminRole || entry.userId !== currentUserId), [directoryEntries, directoryAdminRole, currentUserId]);
  const filteredDirectoryEntries = useMemo(() => {
    const q = directorySearch.trim().toLowerCase();
    if (!q) return visibleDirectoryEntries;
    return visibleDirectoryEntries.filter((entry) => [entry.applicantName, entry.personalEmail, entry.wiiOfficialEmail, entry.designation, entry.departmentCellProject, entry.employmentType, entry.biometricId].some((value) => String(value || "").toLowerCase().includes(q)));
  }, [directorySearch, visibleDirectoryEntries]);'''
          if role_marker not in text:
              raise SystemExit("UserProfilePage role marker not found")
          text = text.replace(role_marker, role_add, 1)

          promise_old = '''        const [savedProfile, employment, units, bankList, designationList, streamList, mscBatchList, courseList, traineeBatchList, officerList] = await Promise.all([
          getMyProfile(), getEmploymentTypes(), getOrgUnits(["department", "cell", "project"]), getBanks(), getDesignations(), getStreams(), getMscBatches(), getCourses(), getTraineeBatches(), getProfileOfficers(),
        ]);'''
          promise_new = '''        const directoryPromise = directoryCanBrowse ? getProfileDirectory() : Promise.resolve([] as ProfileDirectoryEntry[]);
        const [savedProfile, employment, units, bankList, designationList, streamList, mscBatchList, courseList, traineeBatchList, officerList, directoryList] = await Promise.all([
          getMyProfile(), getEmploymentTypes(), getOrgUnits(["department", "cell", "project"]), getBanks(), getDesignations(), getStreams(), getMscBatches(), getCourses(), getTraineeBatches(), getProfileOfficers(), directoryPromise,
        ]);'''
          if promise_old not in text:
              raise SystemExit("UserProfilePage Promise.all marker not found")
          text = text.replace(promise_old, promise_new, 1)

          profile_set_old = '''        setEmploymentTypes(employment); setOrgUnits(units); setBanks(bankList); setDesignations(designationList); setStreams(streamList); setMscBatches(mscBatchList); setCourses(courseList); setTraineeBatches(traineeBatchList); setOfficers(officerList);
        if (savedProfile) { const master=employment.find((x)=>x.displayName===savedProfile.employmentType||x.code===savedProfile.employmentType); setProfile({ ...toFormState(savedProfile), employmentTypeId: savedProfile.employmentTypeId ?? master?.id ?? null }); }'''
          profile_set_new = '''        setEmploymentTypes(employment); setOrgUnits(units); setBanks(bankList); setDesignations(designationList); setStreams(streamList); setMscBatches(mscBatchList); setCourses(courseList); setTraineeBatches(traineeBatchList); setOfficers(officerList);
        if (savedProfile) setCurrentUserId(Number(savedProfile.userId));
        setDirectoryEntries(directoryList);
        if (directoryCanBrowse && directoryList.length > 0) {
          const firstEntry = directoryList[0];
          setSelectedDirectoryUserId(firstEntry.userId);
          setDirectorySearch(`${firstEntry.applicantName}`);
          const targetProfile = await getUserProfile(firstEntry.userId);
          const master=employment.find((x)=>x.displayName===targetProfile.employmentType||x.code===targetProfile.employmentType);
          setProfile({ ...toFormState(targetProfile), employmentTypeId: targetProfile.employmentTypeId ?? master?.id ?? null });
        } else if (savedProfile) {
          const master=employment.find((x)=>x.displayName===savedProfile.employmentType||x.code===savedProfile.employmentType);
          setSelectedDirectoryUserId(selfOnlyRole ? Number(savedProfile.userId) : null);
          setProfile({ ...toFormState(savedProfile), employmentTypeId: savedProfile.employmentTypeId ?? master?.id ?? null });
        }'''
          if profile_set_old not in text:
              raise SystemExit("UserProfilePage profile load marker not found")
          text = text.replace(profile_set_old, profile_set_new, 1)
          text = text.replace('  }, []);\n\n  useEffect(() => () => {', '  }, [currentRole]);\n\n  useEffect(() => () => {', 1)

          # Add target-selection helper before the employment-change handler.
          emp_marker = '  const handleEmploymentChange='
          helper = '''  const handleDirectorySelect = async (entry: ProfileDirectoryEntry) => {
    setDirectoryOpen(false);
    setDirectorySearch(entry.applicantName);
    setSelectedDirectoryUserId(entry.userId);
    setDirectoryError("");
    setDirectoryLoading(true);
    try {
      const targetProfile = await getUserProfile(entry.userId);
      const master = employmentTypes.find((x) => x.displayName === targetProfile.employmentType || x.code === targetProfile.employmentType);
      setProfile({ ...toFormState(targetProfile), employmentTypeId: targetProfile.employmentTypeId ?? master?.id ?? null });
      setSaveError("");
      setValidationAttempted(false);
    } catch (error) {
      setDirectoryError(error instanceof Error ? error.message : "Unable to load employee profile.");
    } finally {
      setDirectoryLoading(false);
    }
  };

'''
          if emp_marker not in text:
              raise SystemExit("UserProfilePage employment handler marker not found")
          text = text.replace(emp_marker, helper + emp_marker, 1)

          # Replace the header with the requested right-side directory/search placement.
          header_pattern = re.compile(r'      <div className="bg-slate-900 text-white rounded-2xl p-4 sm:p-6 border border-slate-800 shadow-md relative overflow-hidden min-h-\[140px\]">.*?\n      </div>\n\n      <form onSubmit', re.S)
          header_replacement = '''      <div className="bg-slate-900 text-white rounded-2xl p-4 sm:p-6 border border-slate-800 shadow-md relative overflow-visible min-h-[140px]">
        <div className="absolute top-0 right-0 w-80 h-full bg-emerald-500/5 pointer-events-none blur-2xl" />
        <div className="relative z-10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
          <div className="space-y-2 min-w-0">
            <div className="flex flex-wrap items-center gap-2">
              <span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 tracking-wider flex items-center gap-1">
                <BadgeCheck className="w-3.5 h-3.5" />Access Management Portal
              </span>
              <span className="text-xs text-slate-400">• Wildlife Institute of India</span>
            </div>
            <h1 className="text-lg sm:text-2xl font-extrabold tracking-tight leading-snug">
              {selfOnlyRole ? "User Profile & Service Records" : "Admin Personnel Records & Directory"}
            </h1>
            <p className="text-xs text-slate-300 leading-relaxed max-w-xl">
              {selfOnlyRole ? "Maintain your official personal, employment, academic, project and bank records." : "Search and inspect official service records, designations, and bank details for authorized personnel."}
            </p>
          </div>

          {directoryCanBrowse && (
            <div className="relative z-30 w-full lg:w-[390px] shrink-0">
              <div className="flex items-center justify-between gap-2 mb-1.5">
                <span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-300">Personnel Directory</span>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${directoryAdminRole ? "text-amber-300 bg-amber-950/60 border-amber-800" : "text-emerald-300 bg-emerald-950/60 border-emerald-800"}`}>
                  {directoryAdminRole ? "ADMIN • EDIT" : "RELATED • VIEW"}
                </span>
              </div>
              <div className="relative">
                <div className="flex items-center gap-2 bg-slate-800/95 border border-slate-700 rounded-xl px-3 py-2 shadow-inner">
                  <Search className="w-4 h-4 text-emerald-400 shrink-0" />
                  <input
                    type="text"
                    value={directorySearch}
                    onChange={(e) => { setDirectorySearch(e.target.value); setDirectoryOpen(true); }}
                    onFocus={() => setDirectoryOpen(true)}
                    placeholder="Search staff by name or email..."
                    className="bg-transparent text-white placeholder-slate-400 focus:outline-none w-full text-xs min-w-0"
                  />
                  {directorySearch && <button type="button" onClick={() => { setDirectorySearch(""); setDirectoryOpen(true); }} className="p-0.5 text-slate-400 hover:text-white cursor-pointer"><X className="w-3.5 h-3.5" /></button>}
                </div>
                {directoryOpen && (
                  <div className="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden max-h-72 overflow-y-auto">
                    <div className="p-2 border-b border-slate-800 bg-slate-950 flex items-center justify-between">
                      <span className="text-[10px] font-bold text-slate-400">
                        {directorySearch.trim() ? `MATCHING PERSONNEL (${filteredDirectoryEntries.length})` : `AUTHORIZED PERSONNEL (${visibleDirectoryEntries.length})`}
                      </span>
                      <button type="button" onClick={() => setDirectoryOpen(false)} className="text-[10px] text-slate-400 hover:text-white cursor-pointer">Close</button>
                    </div>
                    {directoryLoading && <div className="p-3 text-xs text-slate-400 text-center">Loading profile...</div>}
                    {!directoryLoading && filteredDirectoryEntries.length === 0 && <div className="p-3 text-xs text-slate-400 text-center">No matching personnel profile found.</div>}
                    {!directoryLoading && filteredDirectoryEntries.map((entry) => (
                      <button key={entry.userId} type="button" onClick={() => void handleDirectorySelect(entry)} className={`w-full text-left p-2.5 hover:bg-slate-800 flex items-center gap-2.5 border-b border-slate-800/60 transition-colors cursor-pointer ${selectedDirectoryUserId === entry.userId ? "bg-slate-800/90 border-l-4 border-l-emerald-400" : ""}`}>
                        <div className="w-8 h-8 rounded-full bg-emerald-950 border border-emerald-800 flex items-center justify-center shrink-0"><User className="w-4 h-4 text-emerald-400" /></div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between gap-2"><span className="text-xs font-extrabold text-white truncate">{entry.salutation ? `${entry.salutation} ` : ""}{entry.applicantName}</span><span className="text-[10px] font-mono text-emerald-400">#{entry.userId}</span></div>
                          <p className="text-[11px] text-slate-400 truncate">{entry.designation || "—"} • {entry.departmentCellProject || entry.employmentType || "—"}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
              {directoryError && <p className="mt-1.5 text-[10px] text-rose-300">{directoryError}</p>}
            </div>
          )}
        </div>
      </div>

      <form onSubmit'''
          new_text, count = header_pattern.subn(header_replacement, text, count=1)
          if count != 1:
              raise SystemExit("UserProfilePage header replacement failed")
          text = new_text

          # Make the form genuinely read-only for non-editable directory viewers.
          text = text.replace(
              '        .profile-required-star { color:#dc2626; font-weight:800; margin-left:2px; }',
              '        .profile-required-star { color:#dc2626; font-weight:800; margin-left:2px; }\n        .profile-form.directory-readonly input, .profile-form.directory-readonly select, .profile-form.directory-readonly textarea { pointer-events:none; background-color:#f1f5f9 !important; color:#64748b !important; }\n        .profile-form.directory-readonly button[type="submit"] { display:none; }',
          )
          text = text.replace(
              'className={`profile-form space-y-5 ${validationAttempted ? "validation-attempted" : ""}`}',
              'className={`profile-form space-y-5 ${validationAttempted ? "validation-attempted" : ""} ${!profileEditable ? "directory-readonly" : ""}`}',
              1,
          )

          # Block submit for read-only roles and route admin edits to the admin endpoint.
          text = text.replace(
              '    if (saving || loading) return;\n    setValidationAttempted(true);',
              '    if (saving || loading) return;\n    if (!profileEditable) { setSaveError("This employee profile is read-only for your role."); return; }\n    setValidationAttempted(true);',
              1,
          )
          text = text.replace(
              '      let savedProfile = await updateMyProfile(payload);',
              '      const editingOtherProfile = directoryAdminRole && selectedDirectoryUserId !== null && selectedDirectoryUserId !== currentUserId;\n      let savedProfile = editingOtherProfile ? await updateProfileAsAdmin(selectedDirectoryUserId, payload) : await updateMyProfile(payload);',
              1,
          )
          # Admin directory editing intentionally keeps photo upload disabled until a target-aware photo endpoint is added.
          text = text.replace(
              '(currentRole === "applicant" || currentRole === "user" || adminCanEditOfficialFields)',
              'selfOnlyRole',
              1,
          )

