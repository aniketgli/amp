name: Final Profile Fix v4
on:
  push:
    branches: [production-readiness-cleanup]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip profile-v4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Profile form: switch legacy text/batch masters to DB master IDs.
          f=Path('src/features/profile/pages/UserProfilePage.tsx'); s=f.read_text()
          s=s.replace('  ProfileBatch,\n','  ProfileDesignation,\n  ProfileMscBatch,\n  ProfileCourse,\n  ProfileTraineeBatch,\n  ProfileStream,\n')
          s=s.replace('  getBatches,\n','  getDesignations,\n  getMscBatches,\n  getCourses,\n  getTraineeBatches,\n  getStreams,\n')
          s=re.sub(r'  const \[batches, setBatches\] = useState<ProfileBatch\[\]>\(\[\]\);', '  const [designations, setDesignations] = useState<ProfileDesignation[]>([]);\n  const [streams, setStreams] = useState<ProfileStream[]>([]);\n  const [mscBatches, setMscBatches] = useState<ProfileMscBatch[]>([]);\n  const [courses, setCourses] = useState<ProfileCourse[]>([]);\n  const [traineeBatches, setTraineeBatches] = useState<ProfileTraineeBatch[]>([]);',s,1)
          s=re.sub(r'  const batchOptions = useMemo\(\(\) => \{.*?\n  \}, \[batches, employmentCode\]\);','  const designationOptions=useMemo(()=>designations.filter(x=>Number(x.employmentTypeId)===Number(profile.employmentTypeId)),[designations,profile.employmentTypeId]);\n  const mscBatchOptions=useMemo(()=>mscBatches.filter(x=>Number(x.streamId)===Number(profile.streamId)),[mscBatches,profile.streamId]);\n  const traineeBatchOptions=useMemo(()=>traineeBatches.filter(x=>Number(x.courseId)===Number(profile.courseId)),[traineeBatches,profile.courseId]);',s,1,flags=re.S)
          s=re.sub(r'        const \[savedProfile, employment, units, bankList, batchList, officerList\] = await Promise\.all\(\[.*?\n        \]\);','        const [savedProfile, employment, units, bankList, designationList, streamList, mscBatchList, courseList, traineeBatchList, officerList]=await Promise.all([\n          getMyProfile(),getEmploymentTypes(),getOrgUnits(["department","cell","project"]),getBanks(),getDesignations(),getStreams(),getMscBatches(),getCourses(),getTraineeBatches(),getProfileOfficers(),\n        ]);',s,1,flags=re.S)
          s=re.sub(r'        setEmploymentTypes\(employment\); setOrgUnits\(units\); setBanks\(bankList\); setBatches\(batchList\); setOfficers\(officerList\);\n        if \(savedProfile\) setProfile\(toFormState\(savedProfile\)\);','        setEmploymentTypes(employment);setOrgUnits(units);setBanks(bankList);setDesignations(designationList);setStreams(streamList);setMscBatches(mscBatchList);setCourses(courseList);setTraineeBatches(traineeBatchList);setOfficers(officerList);\n        if(savedProfile){const em=employment.find(x=>x.displayName===savedProfile.employmentType||x.code===savedProfile.employmentType);setProfile({...toFormState(savedProfile),employmentTypeId:savedProfile.employmentTypeId??em?.id??null});}',s,1)
          a=s.index('  const handleEmploymentChange = (value: string) => {'); b=s.index('\n\n  const handleProfilePhotoChange',a)
          s=s[:a]+'''  const handleEmploymentChange=(value:string)=>{const x=employmentTypes.find(i=>i.displayName===value||i.code===value);const name=x?.displayName||value;setProfile(p=>({...p,employmentType:name,employmentTypeId:x?.id??null,departmentId:null,projectId:null,organizationId:null,designation:"",designationId:null,stream:"",streamId:null,courseName:"",courseId:null,batchId:null,mscBatchId:null,traineeBatchId:null}));setSaveError("");setPhotoError("");setValidationAttempted(false);};'''+s[b:]
          s=s.replace('employmentType: profile.employmentType || "",','employmentType: profile.employmentType || "", employmentTypeId: profile.employmentTypeId ?? null,',1)
          s=s.replace('designation: profile.designation || null, stream: profile.stream || null, courseName: profile.courseName || null,','designation: profile.designation || null, designationId: profile.designationId ?? null, stream: profile.stream || null, streamId: profile.streamId ?? null, courseName: profile.courseName || null, courseId: profile.courseId ?? null,',1)
          s=s.replace('departmentId: profile.departmentId ?? null, projectId: profile.projectId ?? null, reportingOfficerId:','departmentId: profile.departmentId ?? null, projectId: profile.projectId ?? null, organizationId: profile.organizationId ?? profile.departmentId ?? profile.projectId ?? null, reportingOfficerId:',1)
          s=s.replace('reportingManagerId: profile.reportingManagerId ?? null, piUserId: profile.piUserId ?? null, batchId: profile.batchId ?? null,','reportingManagerId: profile.reportingManagerId ?? null, piUserId: profile.piUserId ?? null, batchId: profile.batchId ?? profile.mscBatchId ?? profile.traineeBatchId ?? null, mscBatchId: profile.mscBatchId ?? null, traineeBatchId: profile.traineeBatchId ?? null,',1)
          s=s.replace('value={item.code}>{item.displayName}</option>','value={item.displayName}>{item.displayName}</option>',1)
          s=s.replace('<input required value={profile.designation || ""} onChange={(e) => handleChange("designation", e.target.value)} className={getFieldClass()} />','<select required value={profile.designationId ?? ""} onChange={e=>{const id=e.target.value?Number(e.target.value):null;const x=designationOptions.find(d=>Number(d.id)===id);setProfile(p=>({...p,designationId:id,designation:x?.designationName||""}));}} className={getFieldClass()}><option value="">Select Designation</option>{designationOptions.map(x=><option key={x.id} value={x.id}>{x.designationName}</option>)}</select>')
          s=s.replace('<input required value={profile.stream || ""} onChange={(e) => handleChange("stream", e.target.value)} className={getFieldClass()} />','<select required value={profile.streamId ?? ""} onChange={e=>{const id=e.target.value?Number(e.target.value):null;const x=streams.find(v=>Number(v.id)===id);setProfile(p=>({...p,streamId:id,stream:x?.streamName||"",mscBatchId:null,batchId:null}));}} className={getFieldClass()}><option value="">Select Stream</option>{streams.map(x=><option key={x.id} value={x.id}>{x.streamName}</option>)}</select>')
          s=s.replace('<input required value={profile.courseName || ""} onChange={(e) => handleChange("courseName", e.target.value)} className={getFieldClass()} />','<select required value={profile.courseId ?? ""} onChange={e=>{const id=e.target.value?Number(e.target.value):null;const x=courses.find(v=>Number(v.id)===id);setProfile(p=>({...p,courseId:id,courseName:x?.courseName||"",traineeBatchId:null,batchId:null}));}} className={getFieldClass()}><option value="">Select Course</option>{courses.map(x=><option key={x.id} value={x.id}>{x.courseName}</option>)}</select>')
          s=s.replace('{batchOptions.map((batch) => <option key={batch.id} value={batch.id}>{batch.batchLabel}</option>)}','{mscBatchOptions.map(x=><option key={x.id} value={x.id}>{x.batchName} ({x.batchCode})</option>)}',1)
          s=s.replace('{batchOptions.map((batch) => <option key={batch.id} value={batch.id}>{batch.batchLabel}</option>)}','{traineeBatchOptions.map(x=><option key={x.id} value={x.id}>{x.batchName} ({x.batchCode})</option>)}',1)
          s=s.replace('value={profile.batchId ?? ""} onChange={(e) => handleChange("batchId", e.target.value ? Number(e.target.value) : null)} className={getFieldClass()}><option value="">Select MSc Batch</option>','value={profile.mscBatchId ?? profile.batchId ?? ""} onChange={e=>handleChange("mscBatchId",e.target.value?Number(e.target.value):null)} className={getFieldClass()}><option value="">Select MSc Batch</option>',1)
          s=s.replace('value={profile.batchId ?? ""} onChange={(e) => handleChange("batchId", e.target.value ? Number(e.target.value) : null)} className={getFieldClass()}><option value="">Select Diploma Batch</option>','value={profile.traineeBatchId ?? profile.batchId ?? ""} onChange={e=>handleChange("traineeBatchId",e.target.value?Number(e.target.value):null)} className={getFieldClass()}><option value="">Select Diploma Batch</option>',1)
          f.write_text(s)

          # Backend: enforce new master references and persist their IDs.
          f=Path('server/services/profile.service.ts'); p=f.read_text()
          p=p.replace('async function validateEmploymentType(\n  employmentType: EmploymentType,\n): Promise<void> {','async function validateEmploymentType(\n  employmentType: EmploymentType,\n): Promise<number> {',1)
          p=p.replace('  }\n}\n\n/* ============================================================\n   ORG MASTER VALIDATION','  }\n  return Number(rows[0].id);\n}\n\n/* ============================================================\n   ORG MASTER VALIDATION',1)
          p=re.sub(r'async function validateBatch\(\n  batchId: number \| null,.*?\n\}\n\n/\* ============================================================\n   BANK VALIDATION', '''async function validateBatch(batchId:number|null,employmentType:EmploymentType):Promise<void>{if(employmentType!==EMPLOYMENT_TYPES.MSC_STUDENT&&employmentType!==EMPLOYMENT_TYPES.DIPLOMA_TRAINEE){if(batchId!==null)throw new Error("Batch is not applicable for the selected Employment Type.");return;}if(batchId===null)throw new Error("Batch is required.");const table=employmentType===EMPLOYMENT_TYPES.MSC_STUDENT?"profile_msc_batches":"profile_trainee_batches";const [rows]:any=await db.query(`SELECT id FROM ${table} WHERE id=? AND status='active' LIMIT 1`,[batchId]);if(!rows?.length)throw new Error("Selected Batch is not available.");}\n\n/* ============================================================\n   BANK VALIDATION''',p,count=1,flags=re.S)
          marker='/* ============================================================\n   BANK VALIDATION'
          helper='''/* PROFILE MASTER REFERENCE VALIDATION */\nasync function validateProfileMasterReferences(input:any,employmentType:EmploymentType,employmentTypeId:number){let designationId:number|null=null,streamId:number|null=null,courseId:number|null=null,mscBatchId:number|null=null,traineeBatchId:number|null=null,streamName:string|null=null,courseName:string|null=null;const needsDesignation=new Set<EmploymentType>([EMPLOYMENT_TYPES.PERMANENT,EMPLOYMENT_TYPES.DEPUTATION,EMPLOYMENT_TYPES.CONTRACTUAL,EMPLOYMENT_TYPES.RESEARCHER_PROJECT_STAFF]).has(employmentType);if(needsDesignation){designationId=validateId(input.designationId,"Designation");const [r]:any=await db.query(`SELECT id FROM profile_designation_masters WHERE id=? AND employment_type_id=? AND status='active' LIMIT 1`,[designationId,employmentTypeId]);if(!r?.length)throw new Error("Selected Designation is invalid for the selected Employment Type.");}if(employmentType===EMPLOYMENT_TYPES.MSC_STUDENT){streamId=validateId(input.streamId,"Stream");mscBatchId=validateId(input.mscBatchId??input.batchId,"MSc Batch");const [r]:any=await db.query(`SELECT stream_name FROM profile_stream_masters WHERE id=? AND status='active' LIMIT 1`,[streamId]);if(!r?.length)throw new Error("Selected Stream is invalid.");streamName=String(r[0].stream_name);const [b]:any=await db.query(`SELECT id FROM profile_msc_batches WHERE id=? AND stream_id=? AND status='active' LIMIT 1`,[mscBatchId,streamId]);if(!b?.length)throw new Error("Selected MSc Batch does not belong to the selected Stream.");}if(employmentType===EMPLOYMENT_TYPES.DIPLOMA_TRAINEE){courseId=validateId(input.courseId,"Course");traineeBatchId=validateId(input.traineeBatchId??input.batchId,"Trainee Batch");const [r]:any=await db.query(`SELECT course_name FROM profile_course_masters WHERE id=? AND status='active' LIMIT 1`,[courseId]);if(!r?.length)throw new Error("Selected Course is invalid.");courseName=String(r[0].course_name);const [b]:any=await db.query(`SELECT id FROM profile_trainee_batches WHERE id=? AND course_id=? AND status='active' LIMIT 1`,[traineeBatchId,courseId]);if(!b?.length)throw new Error("Selected Trainee Batch does not belong to the selected Course.");}return{designationId,streamId,courseId,mscBatchId,traineeBatchId,streamName,courseName};}\n\n'''
          p=p.replace(marker,helper+marker,1)
          p=p.replace('  await validateEmploymentType(\n    employmentType,\n  );','  const employmentTypeId=await validateEmploymentType(employmentType);',1)
          needle='''  const employmentFields =\n    await validateEmploymentSpecificFields(\n      input,\n      employmentType,\n      dateOfBirth,\n    );'''
          if needle not in p: raise SystemExit('profile employment validation call not found')
          p=p.replace(needle,needle+'\n\n  const masterReferences=await validateProfileMasterReferences(input,employmentType,employmentTypeId);',1)
          p=p.replace('    employmentType,\n\n    gender,','    employmentType,\n    employmentTypeId,\n\n    gender,',1).replace('    designation:\n      employmentFields.designation,','    designation:\n      employmentFields.designation,\n    designationId: masterReferences.designationId,',1).replace('    stream:\n      employmentFields.stream,','    stream:\n      masterReferences.streamName ?? employmentFields.stream,\n    streamId: masterReferences.streamId,',1).replace('    courseName:\n      employmentFields.courseName,','    courseName:\n      masterReferences.courseName ?? employmentFields.courseName,\n    courseId: masterReferences.courseId,',1).replace('    projectId:\n      employmentFields.projectId,','    projectId:\n      employmentFields.projectId,\n\n    organizationId: employmentFields.departmentId ?? employmentFields.projectId ?? null,',1).replace('    batchId:\n      employmentFields.batchId,','    batchId: masterReferences.mscBatchId ?? masterReferences.traineeBatchId ?? employmentFields.batchId,\n    mscBatchId: masterReferences.mscBatchId,\n    traineeBatchId: masterReferences.traineeBatchId,',1)
          f.write_text(p)

          # Admin panel helpers and MySQL driver tuple typing.
          f=Path('src/features/admin/pages/AdminControlPage.tsx'); s=f.read_text()
          if 'function ManagementTable(' not in s:
              m='function ProfileMastersPanel() {'
              h='''function MasterStatusBadge({status}:{status:string}){return <span className="px-2 py-1 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600">{status}</span>;}\nfunction ActionCell({item,onEdit,onToggle}:{item:any;onEdit:()=>void;onToggle:()=>void}){return <td className="p-3 text-right"><button type="button" onClick={onEdit} className="px-2 py-1 text-[10px] font-bold">Edit</button><button type="button" onClick={onToggle} className="px-2 py-1 text-[10px] font-bold">{item.status==='active'?'Deactivate':'Activate'}</button></td>;}\nfunction ManagementTable({headers,rows,render}:{headers:string[];rows:any[];render:(item:any)=>React.ReactNode}){return <div className="overflow-x-auto border rounded-xl"><table className="w-full text-left text-xs"><thead><tr>{headers.map(h=><th key={h} className="p-3">{h}</th>)}</tr></thead><tbody>{rows.length===0?<tr><td colSpan={headers.length} className="p-8 text-center">No records found.</td></tr>:rows.map(item=><tr key={item.id}>{render(item)}</tr>)}</tbody></table></div>;}\n\n'''
              if m not in s:raise SystemExit('admin panel marker missing')
              f.write_text(s.replace(m,h+m,1))
          f=Path('server/services/profile-master-admin.service.ts'); q=f.read_text()
          q=q.replace('if((await db.query(`SELECT id FROM ${table} WHERE ${parentColumn}=? AND batch_number=? ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[parentId,batchNumber,excludeId]:[parentId,batchNumber]))[0]?.length)throw new Error("This batch number already exists for the selected parent.");','const [numberRows]:any=await db.query(`SELECT id FROM ${table} WHERE ${parentColumn}=? AND batch_number=? ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[parentId,batchNumber,excludeId]:[parentId,batchNumber]);if(numberRows?.length)throw new Error("This batch number already exists for the selected parent.");',1)
          q=q.replace('if((await db.query(`SELECT id FROM ${table} WHERE LOWER(TRIM(batch_code))=LOWER(TRIM(?)) ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[batchCode,excludeId]:[batchCode]))[0]?.length)throw new Error("This batch code already exists.");','const [codeRows]:any=await db.query(`SELECT id FROM ${table} WHERE LOWER(TRIM(batch_code))=LOWER(TRIM(?)) ${excludeId?"AND id <> ?":""} LIMIT 1`,excludeId?[batchCode,excludeId]:[batchCode]);if(codeRows?.length)throw new Error("This batch code already exists.");',1)
          f.write_text(q)
          print('compact final patch complete')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          npm ci
          npm run lint
          npm test
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/profile/pages/UserProfilePage.tsx server/services/profile.service.ts src/features/admin/pages/AdminControlPage.tsx server/services/profile-master-admin.service.ts
          git diff --cached --check
          git commit -m 'fix: finalize profile master integration [skip profile-v4]'
          git rm -f .github/workflows/finalize-profile-integration.yml .github/workflows/finalize-profile-fixes.yml .github/workflows/finalize-profile-fixes-v2.yml .github/workflows/finalize-profile-fixes-v3.yml .github/workflows/finalize-profile-v4.yml
          git commit -m 'chore: remove temporary profile fix workflows [skip profile-v4]'
          git push origin production-readiness-cleanup
