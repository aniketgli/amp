name: Fix Admin Section Dependencies

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_admin_section_dependencies.py
      - name: Commit fix
        run: |
          if git diff --quiet -- src/features/admin/components/FacilitiesServicesSection.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/components/FacilitiesServicesSection.tsx
          git commit -m "fix(admin): resolve split section dependencies"
          git push
