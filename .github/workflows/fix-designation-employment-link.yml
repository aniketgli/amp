name: Fix Designation Employment Link

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Patch designation master UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/admin/components/ProfileMastersSection.tsx')
          text = path.read_text(encoding='utf-8')

          # The backend/save path already uses employmentTypeId. This patch makes
          # the relationship explicit in the Designation Master form UI.
          if 'value={values.employmentTypeId || ""}' not in text:
              anchor = 'value={values.designationName || ""}'
              if anchor not in text:
                  raise SystemExit('Could not find designation name input anchor')

              block = '''<div className="space-y-1.5">
                <label className="text-xs font-semibold text-slate-600">Employment Type</label>
                <select
                  value={values.employmentTypeId || ""}
                  onChange={(e) => setValues((prev) => ({ ...prev, employmentTypeId: e.target.value }))}
                  className="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100"
                  required
                >
                  <option value="">Select Employment Type</option>
                  {activeEmploymentTypes.map((item) => (
                    <option key={item.id} value={item.id}>
                      {item.displayName} ({item.code})
                    </option>
                  ))}
                </select>
              </div>
              '''
              text = text.replace(anchor, block + anchor, 1)

          # Ensure the designation table exposes the linked employment type.
          # Handle the common header variants without touching other master tables.
          patterns = [
              'headers={["Designation", "Designation Code", "Status", "Actions"]}',
              'headers={["Designation Name", "Designation Code", "Status", "Actions"]}',
          ]
          for old in patterns:
              if old in text and 'item.employmentTypeName' not in text:
                  new = old.replace('["Designation", "Designation Code",', '["Designation", "Employment Type", "Designation Code",')
                  new = new.replace('["Designation Name", "Designation Code",', '["Designation Name", "Employment Type", "Designation Code",')
                  text = text.replace(old, new, 1)
                  break

          # If the designation row is the compact inline form used by this panel,
          # add the parent value next to the designation name/code when absent.
          if 'item.employmentTypeName' not in text:
              row_anchor = 'item.designationName'
              if row_anchor in text:
                  idx = text.find(row_anchor)
                  close = text.find('</td>', idx)
                  if close != -1:
                      # Insert only when this occurrence is inside the designation table.
                      table_start = text.rfind('designations', 0, idx)
                      if table_start != -1:
                          cell = '<td className="px-4 py-3 font-medium text-slate-700">{item.employmentTypeName || "—"}</td>'
                          text = text[:close + len('</td>')] + cell + text[close + len('</td>'):]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/components/ProfileMastersSection.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: link designation master to employment type [skip ci]"
          git push origin production-readiness-cleanup
