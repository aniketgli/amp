name: Fix Designation Employment Link

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Finalize designation master link
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/admin/components/ProfileMastersSection.tsx')
          text = path.read_text(encoding='utf-8')

          bad = re.compile(r'designationName:\s*<div className="space-y-1\.5">.*?</div>\s*values\.designationName\?\.trim\(\)\s*\|\|\s*""', re.S)
          text, _ = bad.subn('designationName: values.designationName?.trim() || ""', text, count=1)

          old = 'select("employmentTypeId", "Type", employmentTypes.filter((x) => x.status === "active"), "id", "displayName")'
          new = 'select("employmentTypeId", "Employment Type", activeEmploymentTypes, "id", "displayName")'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Designation Employment Type select pattern not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit final UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/components/ProfileMastersSection.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: link designation master to employment type [skip ci]"
          git push origin production-readiness-cleanup
