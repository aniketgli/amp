name: Fix Designation Employment Link

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Patch designation master UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/admin/components/ProfileMastersSection.tsx')
          text = path.read_text(encoding='utf-8')

          # The DB/repository/save path already carries employmentTypeId. Make the
          # parent relationship explicit in the Designation Master modal.
          if 'value={values.employmentTypeId' not in text:
              m = re.search(r'value=\{values\.designationName(?:\s*\|\|\s*""|\s*\?\?\s*"")?\}', text)
              if not m:
                  # Leave a diagnostic file in the branch so the exact JSX can be inspected.
                  positions = [m.start() for m in re.finditer('designationName', text)]
                  Path('debug_designation_ui.txt').write_text(
                      '\n'.join(text[max(0, p-500):p+1000] for p in positions), encoding='utf-8'
                  )
                  raise SystemExit('Could not find designation name input anchor')

              block = '''<div className="space-y-1.5">
                <label className="text-xs font-semibold text-slate-600">Employment Type</label>
                <select
                  value={values.employmentTypeId || ""}
                  onChange={(e) => setValues((prev) => ({ ...prev, employmentTypeId: e.target.value }))}
                  className="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100"
                  required
                >
                  <option value="">Select Employment Type</option>
                  {activeEmploymentTypes.map((item) => (
                    <option key={item.id} value={item.id}>
                      {item.displayName} ({item.code})
                    </option>
                  ))}
                </select>
              </div>\n              '''
              text = text[:m.start()] + block + text[m.start():]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/components/ProfileMastersSection.tsx debug_designation_ui.txt
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: link designation master to employment type [skip ci]"
          git push origin production-readiness-cleanup
