name: Security

on:
  push:
    branches:
      - security-hardening
      - main
  pull_request:
    branches:
      - security-hardening
      - main
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high