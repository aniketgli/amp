name: Sync Profile Masters UI

on:
  push:
    branches:
      - production-readiness-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip profile-masters-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0

      - name: Patch AdminControlPage
        env:
          IMPORTS_GZ_B64: ''
          TYPES_GZ_B64: ''
          PANEL_GZ_B64: ''
        run: |
          python - <<'PY'
          import base64, gzip, os, re
          path = 'src/features/admin/pages/AdminControlPage.tsx'
          s = open(path, encoding='utf-8').read()
          def dec(name):
              return gzip.decompress(base64.b64decode(os.environ[name])).decode('utf-8')
          imports = dec('IMPORTS_GZ_B64')
          types = dec('TYPES_GZ_B64')
          panel = dec('PANEL_GZ_B64')
          react_line = 'import React, { useEffect, useMemo, useState } from "react";\n'
          req_line = 'import { RequisitionRecord, UserRole } from "@/types";\n'
          audit_line = 'import { recordSecurityAuditLog } from "@/services/auditLogger";\n'
          s = s.replace(req_line, '', 1)
          s = s.replace(audit_line, '', 1)
          s = s.replace(react_line, imports, 1)
          marker = '/* =========================================================\n   COMPONENT\n========================================================= */'
          if marker not in s:
              raise SystemExit('component marker not found')
          s = s.replace(marker, types + '\n' + panel + '\n' + marker, 1)
          profile_marker = re.compile(r'\n      /\* =====================================================\n          PROFILE MASTERS\n      ===================================================== \*/.*?(?=\n      /\* =====================================================\n          SECURITY AUDIT)', re.S)
          replacement = '\n      {/* =====================================================\n          PROFILE MASTERS\n      ===================================================== */}\n\n      {activeSubTab === "profile_masters" && <ProfileMastersPanel />}\n'
          s, n = profile_marker.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'profile section replacement count={n}')
          open(path, 'w', encoding='utf-8').write(s)
          print('patched', len(s))
          PY

      - name: Commit UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/admin/pages/AdminControlPage.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize profile masters admin UI [skip profile-masters-sync]'
          git push origin production-readiness-cleanup
