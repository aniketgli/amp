name: Profile Master Patch Runner
on:
  push:
    branches:
      - production-readiness-cleanup
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-cleanup
          fetch-depth: 0
      - name: Apply patch
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python3 scripts/apply_profile_master_actions.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit requested changes
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src
          git diff --cached --quiet && exit 0
          git commit -m "feat: add profile master action controls"
          git push origin production-readiness-cleanup
