name: Refactor Admin Control Page

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run refactor
        run: python3 scripts/refactor_admin_control_page.py

      - name: Commit generated split
        run: |
          if git diff --quiet -- src/features/admin/pages/AdminControlPage.tsx src/features/admin/components; then
            echo "No refactor changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/pages/AdminControlPage.tsx src/features/admin/components
          git commit -m "refactor(admin): split AdminControlPage into sections"
          git push
