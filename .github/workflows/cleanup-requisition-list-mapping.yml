name: Cleanup Requisition List Mapping

on:
  push:
    branches:
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Fix requisition list mapping
        shell: python
        run: |
          from pathlib import Path

          path = Path("server/repositories/requisition.repository.ts")
          text = path.read_text(encoding="utf-8")

          start_marker = "export async function getAllRequisitions() {"
          end_marker = "// ------------------------------------------------------------\n// Get one complete requisition."

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Could not locate getAllRequisitions block safely.")

          replacement = '''export async function getAllRequisitions() {\n  const [rows]: any = await db.query(\n    `\n    SELECT\n      r.id,\n      r.applicant_id\n    FROM requisitions r\n    INNER JOIN users u\n      ON u.id = r.applicant_id\n    ORDER BY\n      r.submitted_at DESC,\n      r.id DESC\n    `,\n  );\n\n  const requisitionIds = (rows || [])\n    .map((row: any) => String(row?.id || "").trim())\n    .filter(Boolean);\n\n  // The UI consumes the normalized RequisitionRecord shape.\n  // Reuse getRequisitionById() so list and detail responses have\n  // exactly the same frontend-compatible structure.\n  const requisitions = await Promise.all(\n    requisitionIds.map((id: string) => getRequisitionById(id)),\n  );\n\n  return requisitions.filter(Boolean);\n}\n\n'''

          path.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8",
          )

          print("Updated getAllRequisitions() to return normalized records.")

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/cleanup-requisition-list-mapping.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add server/repositories/requisition.repository.ts .github/workflows/cleanup-requisition-list-mapping.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize requisitions returned to frontend"
          git push origin HEAD:production-readiness-cleanup
