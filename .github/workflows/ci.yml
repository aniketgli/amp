name: CI

on:
  push:
    branches:
      - security-hardening
      - main
      - production-readiness-cleanup
  pull_request:
    branches:
      - security-hardening
      - main
      - production-readiness-cleanup

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build

# Production-readiness branch validation enabled.
# Final profile integration verification trigger.
# Robust finalization pass.
