name: CI

on:
  push:
    branches:
      - security-hardening
      - main
      - production-readiness-cleanup
  pull_request:
    branches:
      - security-hardening
      - main
      - production-readiness-cleanup

permissions:
  contents: write

jobs:
  validate:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove temporary admin quick statistics panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/admin/pages/AdminControlPage.tsx")
          text = path.read_text(encoding="utf-8")

          start_marker = "        {/* QUICK STATISTICS */}"
          end_marker = "        </div>\n      </div>"

          start = text.find(start_marker)
          if start == -1:
              raise SystemExit("QUICK STATISTICS panel not found")

          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit("QUICK STATISTICS panel end not found")

          end += len("        </div>")
          path.write_text(text[:start] + text[end:], encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/remove-admin-quick-statistics.yml scripts/.remove-quick-statistics-trigger
          git add src/features/admin/pages/AdminControlPage.tsx
          git commit -m "chore: remove admin quick statistics panel"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Production build
        run: npm run build
